<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BAPE · TÀI XỈU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #000a0f;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #gameFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }
        /* TOOL NHỎ GỌN */
        .float-tool {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 99999;
            cursor: grab;
        }
        .float-tool:active { cursor: grabbing; }
        
        .tool-main {
            width: 260px;
            background: rgba(0, 18, 14, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 180, 0.4);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .tool-header {
            padding: 10px 14px;
            background: rgba(0, 255, 180, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            border-bottom: 1px solid rgba(0, 255, 180, 0.2);
        }
        .tool-header h4 {
            color: #00ffb3;
            font-size: 0.8rem;
            font-weight: 800;
        }
        .ctrl-btn {
            background: rgba(0, 255, 180, 0.2);
            border: none;
            color: #00ffb3;
            width: 26px;
            height: 26px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .tool-body {
            padding: 14px;
        }
        /* Kết quả chính */
        .pred-box {
            text-align: center;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .pred-label {
            font-size: 0.55rem;
            color: #77ffbb;
        }
        .pred-value {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.2;
        }
        .pred-value.TAI { color: #ff4d4d; text-shadow: 0 0 10px #ff4d4d; }
        .pred-value.XIU { color: #33ff88; text-shadow: 0 0 10px #33ff88; }
        .confidence {
            font-size: 0.65rem;
            color: #00ffb3;
        }
        /* Thống kê nhỏ */
        .small-stats {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .small-stats div {
            flex: 1;
            background: rgba(0,30,25,0.5);
            border-radius: 12px;
            padding: 5px;
            text-align: center;
        }
        .small-stats .num {
            font-size: 1rem;
            font-weight: 900;
            color: #00ffb3;
        }
        .small-stats .txt {
            font-size: 0.5rem;
            color: #88ffcc;
        }
        /* Chain ngắn */
        .chain-area {
            margin-bottom: 10px;
        }
        .chain-title {
            font-size: 0.55rem;
            color: #77ffbb;
            margin-bottom: 5px;
        }
        .chain-list {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .chain-dot {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.65rem;
            background: #0a2a22;
        }
        .chain-dot.TAI { background: #ff4d4d; box-shadow: 0 0 4px #ff4d4d; }
        .chain-dot.XIU { background: #33ff88; box-shadow: 0 0 4px #33ff88; color: #000; }
        
        .api-status {
            font-size: 0.5rem;
            text-align: center;
            margin-top: 8px;
            color: #338866;
        }
        /* THU NHỎ */
        .tool-mini {
            background: rgba(0, 18, 14, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(0, 255, 180, 0.4);
        }
        .mini-pred {
            font-size: 1rem;
            font-weight: 900;
        }
        .mini-pred.TAI { color: #ff4d4d; }
        .mini-pred.XIU { color: #33ff88; }
        .mini-conf {
            font-size: 0.65rem;
            color: #00ffb3;
        }
        .hidden { display: none; }
        
        /* OVERLAY THÔNG BÁO ĐÚNG/SAI 1 LẦN */
        .result-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999999;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(20px);
            padding: 20px 35px;
            border-radius: 60px;
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            border: 2px solid;
            opacity: 0;
            transition: 0.15s;
            pointer-events: none;
        }
        .result-toast.show {
            opacity: 1;
        }
        .result-toast.win {
            color: #33ff88;
            border-color: #33ff88;
            text-shadow: 0 0 15px #33ff88;
            background: rgba(0,30,0,0.95);
        }
        .result-toast.lose {
            color: #ff4d4d;
            border-color: #ff4d4d;
            text-shadow: 0 0 15px #ff4d4d;
            background: rgba(30,0,0,0.95);
        }
    </style>
</head>
<body>

<iframe id="gameFrame" src="https://web.sunwin.mw"></iframe>

<div class="float-tool" id="floatTool">
    <!-- Trạng thái thu nhỏ -->
    <div class="tool-mini" id="miniState">
        <span class="mini-pred" id="miniPred">TÀI</span>
        <span class="mini-conf" id="miniConf">--%</span>
        <button class="ctrl-btn" id="expandBtn" style="width:22px;height:22px;">🔓</button>
    </div>

    <!-- Trạng thái mở -->
    <div class="tool-main hidden" id="expandedState">
        <div class="tool-header" id="dragHandle">
            <h4>🔮 BAPE · TÀI XỈU</h4>
            <div>
                <button class="ctrl-btn" id="minimizeBtn">─</button>
                <button class="ctrl-btn" id="clearHistoryBtn" style="font-size:0.7rem;">🗑️</button>
            </div>
        </div>
        <div class="tool-body">
            <div class="pred-box">
                <div class="pred-label">📡 DỰ ĐOÁN TIẾP THEO</div>
                <div class="pred-value" id="mainPred">--</div>
                <div class="confidence" id="mainConf">Độ chuẩn: --%</div>
            </div>
            <div class="small-stats">
                <div><div class="num" id="winCount">0</div><div class="txt">THẮNG</div></div>
                <div><div class="num" id="loseCount">0</div><div class="txt">THUA</div></div>
                <div><div class="num" id="wrCount">0%</div><div class="txt">WR</div></div>
            </div>
            <div class="chain-area">
                <div class="chain-title">🎲 12 PHIÊN GẦN NHẤT</div>
                <div class="chain-list" id="chainList"></div>
            </div>
            <div class="api-status" id="apiStatus">🟢 KẾT NỐI VPS...</div>
        </div>
    </div>
</div>

<div class="result-toast" id="resultToast"></div>

<script>
    // ========== CẤU HÌNH ==========
    const API_URL = 'https://isa-accomplish-fork-capitol.trycloudflare.com/api/history';
    const FETCH_INTERVAL = 3500;  // fetch liên tục để lấy phiên mới
    const TOAST_DURATION = 2500;   // hiện đúng/sai trong 2.5s

    // ========== DATA ==========
    let sessions = [];
    let predictions = [];
    let lastPredictedPhien = null;
    let lastPredictionValue = null;
    let hasShownResultForPhien = new Set(); // tránh báo lại nhiều lần cùng 1 phiên

    // Load cache
    try {
        let saved = localStorage.getItem('bape_final');
        if(saved) {
            let d = JSON.parse(saved);
            if(d.predictions) predictions = d.predictions;
            if(d.sessions) sessions = d.sessions;
            if(d.lastPredictedPhien) lastPredictedPhien = d.lastPredictedPhien;
            if(d.lastPredictionValue) lastPredictionValue = d.lastPredictionValue;
        }
    } catch(e) {}

    function saveData() {
        localStorage.setItem('bape_final', JSON.stringify({
            predictions, sessions, lastPredictedPhien, lastPredictionValue
        }));
    }

    // ========== HEX ENGINE 15 THUẬT TOÁN ==========
    function createHex(dice) {
        let raw = dice.map(d => d.toString(16)).join('');
        raw += dice.reduce((a,b)=>a+b,0).toString(16);
        while(raw.length < 32) raw += raw;
        return raw.substring(0,32);
    }

    const algos = [
        h => parseInt(h.slice(0,2),16)%2===0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(2,4),16)%3===0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(4,6),16)>128 ? 'TAI' : 'XIU',
        h => h.charCodeAt(0)%2===0 ? 'TAI' : 'XIU',
        h => h.charCodeAt(15)%2===0 ? 'TAI' : 'XIU',
        h => h.charCodeAt(31)%2===0 ? 'TAI' : 'XIU',
        h => { let s=0; for(let i=0;i<32;i++) s+=parseInt(h[i],16); return s%2===0?'TAI':'XIU'; },
        h => { let x=0; for(let i=0;i<16;i++) x^=parseInt(h[i],16); return x%2===0?'TAI':'XIU'; },
        h => { let odd=0; for(let i=0;i<32;i++) if(parseInt(h[i],16)%2===1) odd++; return odd>16?'TAI':'XIU'; },
        h => parseInt(h.slice(10,12),16)%5!==0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(20,22),16)%3!==0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(30,32),16)%4!==0 ? 'TAI' : 'XIU',
        h => { let s=0; for(let i=0;i<32;i+=2) s+=parseInt(h.slice(i,i+2),16); return s%2===0?'TAI':'XIU'; },
        h => parseInt(h.slice(0,4),16)>32768 ? 'TAI' : 'XIU',
        h => h.charCodeAt(0)%3!==0 ? 'TAI' : 'XIU'
    ];

    function analyzeHex(hex) {
        let tai=0, xiu=0;
        for(let a of algos) a(hex)==='TAI' ? tai++ : xiu++;
        let pred = tai > xiu ? 'TAI' : 'XIU';
        let conf = Math.min(85, Math.max(52, Math.round(Math.max(tai,xiu)/(tai+xiu)*100)));
        return { pred, conf };
    }

    // ========== HIỂN THỊ ĐÚNG/SAI 1 LẦN DUY NHẤT ==========
    function showResultToast(isWin) {
        const toast = document.getElementById('resultToast');
        toast.textContent = isWin ? '✅ CHÍNH XÁC' : '❌ SAI RỒI';
        toast.className = `result-toast show ${isWin ? 'win' : 'lose'}`;
        setTimeout(() => {
            toast.classList.remove('show');
        }, TOAST_DURATION);
    }

    // ========== KIỂM TRA KẾT QUẢ PHIÊN TRƯỚC ==========
    // Chỉ gọi 1 lần duy nhất khi có kết quả mới
    function checkAndNotifyResult(prevPhien, actualResult) {
        if (!prevPhien || !actualResult) return false;
        // Nếu đã thông báo cho phiên này rồi thì bỏ qua
        if (hasShownResultForPhien.has(prevPhien)) return false;
        
        // Nếu có dự đoán cho phiên đó
        if (lastPredictedPhien === prevPhien && lastPredictionValue) {
            const isWin = (lastPredictionValue === actualResult);
            
            // Lưu vào lịch sử
            predictions.push({
                phien: prevPhien,
                pred: lastPredictionValue,
                actual: actualResult,
                ok: isWin
            });
            if (predictions.length > 100) predictions.shift();
            saveData();
            
            // Hiển thị đúng/sai 1 lần
            showResultToast(isWin);
            
            // Đánh dấu phiên này đã được xử lý
            hasShownResultForPhien.add(prevPhien);
            
            // Cập nhật UI thống kê
            updateStatsUI();
            renderHistoryChainUI();
            return true;
        }
        return false;
    }

    // ========== UI RENDER ==========
    function updatePredictionUI(pred, conf) {
        // Mở rộng
        const predEl = document.getElementById('mainPred');
        predEl.innerText = pred;
        predEl.className = `pred-value ${pred}`;
        document.getElementById('mainConf').innerHTML = `Độ chuẩn: ${conf}%`;
        // Thu nhỏ
        const miniPred = document.getElementById('miniPred');
        miniPred.innerText = pred === 'TAI' ? '🔴 TÀI' : '🟢 XỈU';
        miniPred.className = `mini-pred ${pred}`;
        document.getElementById('miniConf').innerHTML = `${conf}%`;
    }

    function renderHistoryChainUI() {
        let recent = sessions.slice(-12);
        if (!recent.length) {
            document.getElementById('chainList').innerHTML = '<div style="color:#888">Chờ...</div>';
            return;
        }
        let html = '';
        for (let s of recent) {
            let res = s.result || s.r;
            html += `<div class="chain-dot ${res}">${res === 'TAI' ? 'T' : 'X'}</div>`;
        }
        document.getElementById('chainList').innerHTML = html;
    }

    function updateStatsUI() {
        let wins = predictions.filter(p => p.ok).length;
        let total = predictions.length;
        let wr = total ? Math.round(wins / total * 100) : 0;
        document.getElementById('winCount').innerText = wins;
        document.getElementById('loseCount').innerText = total - wins;
        document.getElementById('wrCount').innerText = wr + '%';
    }

    // ========== FETCH TỪ VPS ==========
    async function fetchSessions() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            let all = data.sessions || [];
            all.sort((a, b) => parseInt(a.phien) - parseInt(b.phien));
            
            const oldLength = sessions.length;
            sessions = all.slice(-50);
            saveData();
            
            document.getElementById('apiStatus').innerHTML = `🟢 VPS | ${sessions.length} phiên`;
            document.getElementById('apiStatus').style.color = '#33ff88';
            return true;
        } catch (err) {
            document.getElementById('apiStatus').innerHTML = '🔴 Chờ VPS...';
            document.getElementById('apiStatus').style.color = '#ff8866';
            return false;
        }
    }

    // ========== MAIN LOOP ==========
    async function mainLoop() {
        await fetchSessions();
        
        if (sessions.length < 2) {
            setTimeout(mainLoop, FETCH_INTERVAL);
            return;
        }
        
        const latest = sessions[sessions.length - 1];
        const previous = sessions[sessions.length - 2];
        
        // Lấy kết quả thực tế của phiên trước (nếu có)
        if (previous && (previous.result || previous.r)) {
            const actualRes = previous.result || previous.r;
            // Chỉ xử lý 1 lần duy nhất cho phiên đó
            checkAndNotifyResult(previous.phien, actualRes);
        }
        
        // Dự đoán cho phiên hiện tại
        if (latest && (latest.dice || latest.dc)) {
            const dice = latest.dice || latest.dc;
            const hex = createHex(dice);
            const { pred, conf } = analyzeHex(hex);
            
            // Cập nhật UI
            updatePredictionUI(pred, conf);
            renderHistoryChainUI();
            updateStatsUI();
            
            // Lưu dự đoán cho phiên hiện tại (để mai sau so sánh)
            if (lastPredictedPhien !== latest.phien) {
                lastPredictionValue = pred;
                lastPredictedPhien = latest.phien;
                saveData();
            }
        }
        
        setTimeout(mainLoop, FETCH_INTERVAL);
    }

    // ========== DRAG & MINIMIZE ==========
    const toolDiv = document.getElementById('floatTool');
    const miniState = document.getElementById('miniState');
    const expandedState = document.getElementById('expandedState');
    const dragHandle = document.getElementById('dragHandle');
    
    let isExpanded = false;
    let dragActive = false, startX, startY, startLeft, startTop;
    
    function setExpanded(exp) {
        isExpanded = exp;
        if (isExpanded) {
            miniState.classList.add('hidden');
            expandedState.classList.remove('hidden');
        } else {
            miniState.classList.remove('hidden');
            expandedState.classList.add('hidden');
        }
        localStorage.setItem('tool_expanded', isExpanded);
    }
    
    document.getElementById('expandBtn').onclick = () => setExpanded(true);
    document.getElementById('minimizeBtn').onclick = () => setExpanded(false);
    document.getElementById('clearHistoryBtn').onclick = () => {
        if (confirm('Xóa lịch sử dự đoán?')) {
            predictions = [];
            hasShownResultForPhien.clear();
            saveData();
            updateStatsUI();
        }
    };
    
    // Kéo thả
    toolDiv.onmousedown = (e) => {
        if (e.target.closest('.ctrl-btn') || e.target.closest('#expandBtn')) return;
        dragActive = true;
        startX = e.clientX;
        startY = e.clientY;
        const rect = toolDiv.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        toolDiv.style.left = startLeft + 'px';
        toolDiv.style.top = startTop + 'px';
        toolDiv.style.right = 'auto';
        toolDiv.style.bottom = 'auto';
        toolDiv.style.cursor = 'grabbing';
        e.preventDefault();
    };
    
    window.onmousemove = (e) => {
        if (!dragActive) return;
        let left = startLeft + (e.clientX - startX);
        let top = startTop + (e.clientY - startY);
        left = Math.min(window.innerWidth - toolDiv.offsetWidth, Math.max(0, left));
        top = Math.min(window.innerHeight - toolDiv.offsetHeight, Math.max(0, top));
        toolDiv.style.left = left + 'px';
        toolDiv.style.top = top + 'px';
    };
    
    window.onmouseup = () => {
        if (dragActive) {
            dragActive = false;
            toolDiv.style.cursor = '';
            localStorage.setItem('tool_left', toolDiv.style.left);
            localStorage.setItem('tool_top', toolDiv.style.top);
        }
    };
    
    // Load vị trí
    const savedLeft = localStorage.getItem('tool_left');
    const savedTop = localStorage.getItem('tool_top');
    if (savedLeft && savedTop) {
        toolDiv.style.left = savedLeft;
        toolDiv.style.top = savedTop;
        toolDiv.style.right = 'auto';
        toolDiv.style.bottom = 'auto';
    }
    const savedExp = localStorage.getItem('tool_expanded') === 'true';
    setExpanded(savedExp);
    
    // Start
    mainLoop();
</script>
</body>
</html>
