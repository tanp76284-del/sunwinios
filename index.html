<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PHUC SIX HEX · DỰ ĐOÁN 2000 PHIÊN</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0f1a 0%, #061218 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Nunito', system-ui, sans-serif;
            padding: 20px;
        }
        .phucsix-menu {
            max-width: 950px;
            width: 100%;
            background: rgba(8, 20, 25, 0.94);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 180, 0.4);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .phucsix-header {
            background: linear-gradient(115deg, #0a2a22 0%, #051a12 100%);
            padding: 16px 22px;
            border-bottom: 2px solid rgba(0, 255, 180, 0.5);
        }
        .phucsix-header h1 {
            color: #00ffb3;
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .phucsix-header small {
            font-size: 0.7rem;
            background: #1a4a3a;
            padding: 4px 12px;
            border-radius: 40px;
            color: #ccffdd;
        }
        .phucsix-body {
            padding: 22px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .phucsix-body::-webkit-scrollbar { width: 5px; }
        .phucsix-body::-webkit-scrollbar-track { background: #0a2a22; border-radius: 10px; }
        .phucsix-body::-webkit-scrollbar-thumb { background: #00ffb3; border-radius: 10px; }

        .prediction-panel {
            background: linear-gradient(125deg, #001f1a, #000c08);
            border-radius: 28px;
            padding: 18px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 180, 0.4);
        }
        .prediction-label { font-size: 0.7rem; letter-spacing: 2px; color: #77ffcc; }
        .prediction-value { font-size: 3.5rem; font-weight: 900; margin: 8px 0; }
        .prediction-value.TAI { color: #ff5e5e; text-shadow: 0 0 12px #ff4d4d; }
        .prediction-value.XIU { color: #5eff9e; text-shadow: 0 0 12px #33ff88; }
        .confidence { font-size: 0.8rem; background: #0a2f26; display: inline-block; padding: 4px 18px; border-radius: 40px; color: #bbffdd; }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .stats-card {
            background: #071f19;
            padding: 6px 16px;
            border-radius: 32px;
            border: 1px solid #2a6b55;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .win { color: #5eff9e; }
        .lose { color: #ff7777; }

        .chart-block { margin-bottom: 28px; }
        .chart-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffdb7e;
            margin-bottom: 10px;
            padding-left: 12px;
            border-left: 3px solid #ffc107;
        }
        .chart-canvas {
            background: #071a1a;
            border-radius: 20px;
            padding: 10px;
            width: 100%;
            height: 200px;
            border: 1px solid #2a6b55;
        }

        .button-bar {
            display: flex;
            gap: 18px;
            margin: 20px 0 20px;
            flex-wrap: wrap;
        }
        .btn-ai {
            flex: 1;
            background: linear-gradient(95deg, #00cc88, #008866);
            border: none;
            padding: 12px 0;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1rem;
            color: #021c14;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-ai:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(0,255,180,0.4); }
        .btn-refresh {
            flex: 1;
            background: rgba(0, 255, 180, 0.12);
            border: 1px solid #2a8f70;
            padding: 12px 0;
            border-radius: 60px;
            font-weight: 700;
            color: #b3ffe0;
            cursor: pointer;
        }
        .analysis-result {
            background: #071a14;
            border-radius: 24px;
            padding: 16px;
            margin-top: 12px;
            font-size: 0.8rem;
            line-height: 1.5;
            border-left: 5px solid #ffdb7e;
            color: #cce6dd;
        }
        .analysis-result strong {
            color: #ffdb7e;
        }
        .status-text {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed #2a6b55;
            color: #4fba97;
        }
        @media (max-width: 680px) {
            .phucsix-body { padding: 14px; }
            .prediction-value { font-size: 2.4rem; }
            .chart-canvas { height: 150px; }
        }
    </style>
</head>
<body>

<div class="phucsix-menu">
    <div class="phucsix-header">
        <h1>
            🎲 PHUC SIX HEX · AI TÀI XỈU
            <small>⚡ QUÉT 2000 PHIÊN | TRÙNG 12/20 (60%)</small>
        </h1>
    </div>

    <div class="phucsix-body">
        <div class="prediction-panel">
            <div class="prediction-label">🎯 DỰ ĐOÁN PHIÊN TIẾP THEO</div>
            <div class="prediction-value" id="predictionValue">--</div>
            <div class="confidence" id="confidenceText">🔮 ĐỘ TIN CẬY: --%</div>

            <div class="stats-row">
                <div class="stats-card">✅ ĐÚNG: <span class="win" id="winCount">0</span></div>
                <div class="stats-card">❌ SAI: <span class="lose" id="loseCount">0</span></div>
                <div class="stats-card">📊 TỈ LỆ ĐÚNG: <span id="winRate">0%</span></div>
            </div>
        </div>

        <div class="chart-block">
            <div class="chart-title">📊 BIỂU ĐỒ TỔNG ĐIỂM 20 PHIÊN GẦN NHẤT</div>
            <canvas id="totalChart" class="chart-canvas"></canvas>
        </div>
        <div class="chart-block">
            <div class="chart-title">🎲 BIỂU ĐỒ 3 MẶT XÍ NGẦU (Tím ➖ Vàng ➖ Đỏ)</div>
            <canvas id="diceChart" class="chart-canvas"></canvas>
        </div>

        <div class="button-bar">
            <button class="btn-ai" id="analyzeBtn">🧠 PHÂN TÍCH AI</button>
            <button class="btn-refresh" id="refreshBtn">🔄 CẬP NHẬT DỮ LIỆU</button>
        </div>

        <div class="analysis-result" id="analysisResult">
            ✨ Bấm "PHÂN TÍCH AI" để dự đoán.
        </div>
        <div class="status-text" id="statusText">🟢 ĐANG KẾT NỐI VPS ...</div>
    </div>
</div>

<script>
    const VPS_API = 'https://isa-accomplish-fork-capitol.trycloudflare.com/api/history';
    const MAX_SCAN = 2000;       // quét 2000 phiên gần nhất
    const MIN_MATCH = 12;        // chỉ cần 12/20 phiên trùng (60%)
    
    let fullHistory = [];
    let lastScan = [];
    let current20 = [];
    let predictionsLog = [];
    
    let totalChart = null, diceChart = null;

    function getTaiXiu(total) {
        if (total >= 4 && total <= 10) return 'XỈU';
        if (total >= 11 && total <= 17) return 'TÀI';
        return '?';
    }
    function getTotalFromSession(s) {
        let d = s.dice || s.dc;
        return d[0] + d[1] + d[2];
    }

    async function fetchVPS() {
        try {
            const res = await fetch(VPS_API);
            const data = await res.json();
            let all = data.sessions || [];
            all.sort((a,b) => parseInt(a.phien) - parseInt(b.phien));
            fullHistory = all;
            lastScan = fullHistory.slice(-MAX_SCAN);
            current20 = lastScan.slice(-20);
            let info = `🟢 VPS | ${fullHistory.length} phiên | Đang dùng ${lastScan.length} phiên gần nhất (yêu cầu trùng ${MIN_MATCH}/20)`;
            document.getElementById('statusText').innerHTML = info;
            return true;
        } catch(e) {
            document.getElementById('statusText').innerHTML = `🔴 LỖI: ${e.message}`;
            return false;
        }
    }

    function drawCharts() {
        if (!current20.length) return;
        let totals = current20.map(s => getTotalFromSession(s));
        let dice1 = current20.map(s => (s.dice || s.dc)[0]);
        let dice2 = current20.map(s => (s.dice || s.dc)[1]);
        let dice3 = current20.map(s => (s.dice || s.dc)[2]);
        let labels = totals.map((_,i) => i+1);

        if (totalChart) totalChart.destroy();
        const totalCtx = document.getElementById('totalChart').getContext('2d');
        totalChart = new Chart(totalCtx, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Tổng điểm', data: totals, borderColor: '#f7b32b', borderWidth: 2.5, pointRadius: 5, tension: 0.2, fill: true }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#ccc' } } }, scales: { y: { min: 3, max: 18, grid: { color: '#2a5545' }, ticks: { color: '#bbb' } }, x: { ticks: { color: '#bbb' } } } }
        });

        if (diceChart) diceChart.destroy();
        const diceCtx = document.getElementById('diceChart').getContext('2d');
        diceChart = new Chart(diceCtx, {
            type: 'line',
            data: { labels, datasets: [
                { label: 'Tím (Hàng trăm)', data: dice1, borderColor: '#b77cff', borderWidth: 2, tension: 0.2 },
                { label: 'Vàng (Hàng chục)', data: dice2, borderColor: '#fac05e', borderWidth: 2, tension: 0.2 },
                { label: 'Đỏ (Đơn vị)', data: dice3, borderColor: '#ff7359', borderWidth: 2, tension: 0.2 }
            ] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top', labels: { color: '#ccc', font: { size: 9 } } } }, scales: { y: { min: 1, max: 6, grid: { color: '#2a5545' }, ticks: { color: '#bbb' } }, x: { ticks: { color: '#bbb' } } } }
        });
    }

    function updateStatsDisplay() {
        let total = predictionsLog.length;
        let wins = predictionsLog.filter(p => p.ok).length;
        let winRate = total ? Math.round(wins/total*100) : 0;
        document.getElementById('winCount').innerText = wins;
        document.getElementById('loseCount').innerText = total - wins;
        document.getElementById('winRate').innerHTML = winRate + '%';
    }

    async function runAIPrediction() {
        if (current20.length < 10) {
            document.getElementById('analysisResult').innerHTML = '⚠️ Chưa đủ 20 phiên, cần cập nhật thêm dữ liệu.';
            return;
        }
        if (lastScan.length < 50) {
            document.getElementById('analysisResult').innerHTML = '⏳ Đang tải 2000 phiên gần nhất từ VPS...';
            await fetchVPS();
            if (lastScan.length < 30) return;
        }

        document.getElementById('analysisResult').innerHTML = '🔍 ĐANG QUÉT ' + lastScan.length + ' PHIÊN GẦN NHẤT ...';
        
        let targetTotals = current20.map(s => getTotalFromSession(s));
        let lastTarget = targetTotals[targetTotals.length-1];
        let matchedNext = [];
        
        // Tìm cầu trùng với yêu cầu >= MIN_MATCH/20 phiên giống + số cuối phải trùng
        for (let i = 0; i <= lastScan.length - 21; i++) {
            let matchCount = 0;
            for (let j = 0; j < 20; j++) {
                let histTotal = getTotalFromSession(lastScan[i + j]);
                if (histTotal === targetTotals[j]) matchCount++;
            }
            let lastHist = getTotalFromSession(lastScan[i + 19]);
            // Chỉ cần matchCount đủ và số cuối trùng
            if (matchCount >= MIN_MATCH && lastHist === lastTarget) {
                let nextTotal = getTotalFromSession(lastScan[i + 20]);
                matchedNext.push(nextTotal);
            }
        }
        
        // THỐNG KÊ SỐ LẦN TÀI / XỈU (bắt buộc phải hiện)
        let tai = 0, xiu = 0;
        for (let t of matchedNext) {
            if (t >= 11) tai++;
            else if (t <= 10) xiu++;
        }
        let totalMatches = matchedNext.length;
        
        // Nếu không tìm thấy cầu trùng, vẫn phải thống kê dựa trên con số cuối cùng (lastTarget)
        if (totalMatches === 0) {
            // Tìm tất cả lần xuất hiện số lastTarget trong lịch sử (2000 phiên)
            let nextAfterLast = [];
            for (let i = 0; i < lastScan.length - 1; i++) {
                let curTotal = getTotalFromSession(lastScan[i]);
                if (curTotal === lastTarget) {
                    let nxt = getTotalFromSession(lastScan[i + 1]);
                    nextAfterLast.push(nxt);
                }
            }
            for (let t of nextAfterLast) {
                if (t >= 11) tai++;
                else if (t <= 10) xiu++;
            }
            totalMatches = nextAfterLast.length;
        }
        
        let prediction = (tai > xiu) ? 'TÀI' : (xiu > tai) ? 'XỈU' : (Math.random()<0.5?'TÀI':'XỈU');
        let confidence = (tai + xiu) > 0 ? Math.round(Math.max(tai, xiu) / (tai + xiu) * 100) : 0;
        
        // Cập nhật giao diện chính
        let predEl = document.getElementById('predictionValue');
        predEl.innerText = prediction;
        predEl.className = `prediction-value ${prediction === 'TÀI' ? 'TAI' : 'XIU'}`;
        document.getElementById('confidenceText').innerHTML = `🎲 ĐỘ TIN CẬY: ${confidence}% | Dựa trên ${tai + xiu} mẫu`;
        
        // HIỂN THỊ CHI TIẾT SỐ LẦN TÀI / XỈU
        let detail = `
            🔍 QUÉT <strong>${lastScan.length}</strong> phiên gần nhất (yêu cầu trùng ≥${MIN_MATCH}/20 + cùng số cuối).<br>
            📊 SỐ CUỐI CÙNG CỦA 20 PHIÊN: <strong style="color:#ffdb7e">${lastTarget}</strong><br>
            🎯 SAU SỐ <strong>${lastTarget}</strong> NÀY: 
            <span style="color:#ff5e5e">TÀI = ${tai} lần</span> &nbsp;|&nbsp; 
            <span style="color:#5eff9e">XỈU = ${xiu} lần</span> &nbsp;|&nbsp;
            Tổng mẫu: ${tai + xiu}<br>
            🧠 DỰ ĐOÁN: <strong style="color:${prediction==='TÀI'?'#ff5e5e':'#5eff9e'}">${prediction}</strong> (${confidence}%)
        `;
        if (totalMatches === 0 && tai + xiu === 0) {
            detail = `⚠️ KHÔNG TÌM THẤY DỮ LIỆU cho số ${lastTarget} trong ${lastScan.length} phiên gần nhất. Cần thêm phiên lịch sử.`;
        }
        document.getElementById('analysisResult').innerHTML = detail;
    }
    
    async function refreshDataAndCharts() {
        document.getElementById('analysisResult').innerHTML = '⏳ Đang cập nhật dữ liệu từ VPS...';
        await fetchVPS();
        if (lastScan.length >= 20) {
            current20 = lastScan.slice(-20);
            drawCharts();
            document.getElementById('analysisResult').innerHTML = '✅ Đã cập nhật 20 phiên mới nhất. Bấm "PHÂN TÍCH AI" để dự đoán.';
        } else {
            document.getElementById('analysisResult').innerHTML = '⚠️ Chưa đủ 20 phiên, cần thêm dữ liệu từ VPS.';
        }
        updateStatsDisplay();
    }
    
    async function autoUpdate() {
        let oldLen = lastScan.length;
        await fetchVPS();
        if (lastScan.length !== oldLen || JSON.stringify(current20) !== JSON.stringify(lastScan.slice(-20))) {
            current20 = lastScan.slice(-20);
            drawCharts();
            document.getElementById('statusText').innerHTML = `🟢 VPS | ${fullHistory.length} phiên | Tự động cập nhật biểu đồ`;
        }
        updateStatsDisplay();
    }
    
    document.getElementById('analyzeBtn').addEventListener('click', runAIPrediction);
    document.getElementById('refreshBtn').addEventListener('click', refreshDataAndCharts);
    
    (async function init() {
        await refreshDataAndCharts();
        setInterval(autoUpdate, 15000);
    })();
</script>
</body>
</html>
