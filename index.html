<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='40' fill='%230a0a0f'/><text x='90' y='115' text-anchor='middle' font-size='90' font-weight='bold' fill='%23ffd700'>👑</text></svg>">
    <meta name="theme-color" content="#0a0a0f">
    <title>👑 PHUC SIX V15</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;height:100vh;overflow:hidden;font-family:Arial}
        #gf{position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1}
        
        .bw{position:fixed;right:8px;top:100px;z-index:999999;display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none}
        .bw:active{cursor:grabbing}
        
        .bot-tip{background:rgba(10,10,20,.92);border:1px solid #00fff2;border-radius:12px;padding:6px 12px;margin-bottom:6px;text-align:center;backdrop-filter:blur(8px)}
        .pp{font-size:1.2em;font-weight:900}.pp.TAI{color:#ff4d4d}.pp.XIU{color:#33ff88}
        .bi{font-size:.72em;color:#bbb}
        
        .bot-wrap{position:relative;width:105px;height:105px;display:flex;align-items:center;justify-content:center}
        .bot-wrap::before{content:'';position:absolute;inset:-15px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,255,.4),transparent 70%);filter:blur(14px);animation:glow 2s infinite}
        .bot-img{width:100px;height:100px;object-fit:contain;z-index:2;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 0 15px rgba(0,255,255,.7))}
        @keyframes glow{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.6}}
        
        .bm{background:#111522;border:2px solid #00fff2;border-radius:14px;padding:10px;width:300px;display:none;margin-top:8px;color:#fff;text-align:center;font-size:.65em}
        .bm.show{display:block!important}
        .bm h3{color:#ffd700;font-size:.9em;margin-bottom:6px}
        .st{display:flex;justify-content:space-around;margin-bottom:6px;color:#888;font-size:.75em}
        .st b{color:#ffd700}
        .scroll-box{max-height:200px;overflow-y:auto}
        table{width:100%;font-size:.9em;border-collapse:collapse;margin-top:4px}
        th{background:rgba(255,255,255,.05);padding:4px 2px;color:#888}
        td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center}
        .T{color:#ff4d4d;font-weight:bold}.X{color:#33ff88;font-weight:bold}
        .ok{color:#33ff88}.no{color:#ff4d4d}
        
        @media screen and (orientation: landscape){.bw{right:15px;top:50px}.bm{width:350px;max-height:60vh}}
    </style>
</head>
<body>

<iframe id="gf" src="https://web.sunwin.mw"></iframe>

<div class="bw" id="bw">
    <div class="bot-tip">
        <div class="pp" id="pp">--</div>
        <div class="bi" id="bi">READY</div>
    </div>
    <div class="bot-wrap" id="botBtn">
        <img src="https://i.postimg.cc/4dRg6Mrt/IMG-3575.gif" class="bot-img" alt="Bot">
    </div>
    <div class="bm" id="bm">
        <h3>👑 PHUC SIX V15</h3>
        <div class="st">
            <span>T: <b id="w" style="color:#33ff88">0</b></span>
            <span>X: <b id="l" style="color:#ff4d4d">0</b></span>
            <span>WR: <b id="r">0%</b></span>
        </div>
        <div class="scroll-box">
            <table>
                <thead><tr><th>#</th><th>Dự</th><th>KQ</th><th></th></tr></thead>
                <tbody id="tb"><tr><td colspan="4">Đang tải...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ============ CLICK MENU ============
document.getElementById('botBtn').addEventListener('click', function(e){
    e.stopPropagation();
    document.getElementById('bm').classList.toggle('show');
});

// ============ DRAG BOT ============
var bw = document.getElementById('bw');
var dg = false, sx, sy, sl, st;

bw.addEventListener('pointerdown', function(e){
    if(e.target.closest('.bm')) return;
    dg = true;
    sx = e.clientX; sy = e.clientY;
    sl = bw.offsetLeft; st = bw.offsetTop;
    bw.setPointerCapture(e.pointerId);
});

document.addEventListener('pointermove', function(e){
    if(!dg) return;
    bw.style.left = (sl + e.clientX - sx) + 'px';
    bw.style.top = (st + e.clientY - sy) + 'px';
    bw.style.right = 'auto';
});

document.addEventListener('pointerup', function(){ dg = false; });

// ============ DATA ============
let D = {s:[], pr:[], lp:'', lastPhien:''};
try{ let c = localStorage.getItem('psv44'); if(c) D = JSON.parse(c); }catch(e){}
function save(){ localStorage.setItem('psv44', JSON.stringify(D)); }

// ============ LOAD API ============
async function load(){
    try{
        let r = await fetch('https://isa-accomplish-fork-capitol.trycloudflare.com/api/history');
        let d = await r.json();
        let ns = d.sessions || [];
        let map = {};
        D.s.forEach(x => map[x.phien] = x);
        ns.forEach(x => map[x.phien] = x);
        D.s = Object.values(map).sort((a,b) => a.phien - b.phien);
        save(); return true;
    }catch(e){ return false; }
}

// ============ PREDICT ============
function predict(s){
    let n = s.length;
    if(n < 30) return {pr:null, cf:50, skip:true};
    
    let r = s.map(x => x.result || x.r);
    let score = {TAI:0, XIU:0};
    
    // 20 gần nhất
    let last20 = r.slice(-20);
    let t20 = last20.filter(x => x === 'TAI').length;
    if(t20 >= 14) score.XIU += 10;
    if(20 - t20 >= 14) score.TAI += 10;
    
    // Streak
    let lastv = r[n-1], streak = 1;
    for(let i = n-2; i >= 0; i--){ if(r[i] === lastv) streak++; else break; }
    if(streak >= 5) score[lastv === 'TAI' ? 'XIU' : 'TAI'] += 12;
    
    // Pattern
    for(let k = 3; k <= 4; k++){
        let p = r.slice(n-k, n).join('');
        let a = 0, b = 0;
        for(let i = 0; i < n - k; i++){
            if(r.slice(i, i+k).join('') === p){ r[i+k] === 'TAI' ? a++ : b++; }
        }
        if(a + b >= 6){ score.TAI += a; score.XIU += b; }
    }
    
    let diff = Math.abs(score.TAI - score.XIU);
    if(diff < 6) return {pr:null, cf:50, skip:true};
    
    let pr = score.TAI > score.XIU ? 'TAI' : 'XIU';
    let cf = Math.round((Math.max(score.TAI, score.XIU) / (score.TAI + score.XIU)) * 100);
    cf = Math.max(52, Math.min(70, cf));
    
    return {pr, cf, skip:false};
}

// ============ MAIN LOOP ============
async function loop(){
    await load();
    let s = D.s, n = s.length;
    
    if(n > 30){
        let p = predict(s);
        let cur = s[n-1];
        
        // Check kết quả cũ
        if(D.lp && cur.phien != D.lastPhien){
            D.pr.push({p:cur.phien, pr:D.lp, ac:cur.result, ok:D.lp === cur.result});
        }
        
        // Update UI
        if(p.pr){
            D.lp = p.pr;
            D.lastPhien = cur.phien;
            
            let win = D.pr.filter(x => x.ok).length;
            let total = D.pr.length;
            let rate = total ? Math.round(win / total * 100) : 0;
            
            document.getElementById('pp').textContent = p.pr === 'TAI' ? '🔴 TÀI' : '🟢 XỈU';
            document.getElementById('pp').className = 'pp ' + p.pr;
            document.getElementById('bi').textContent = p.cf + '% | WR ' + rate + '% | ' + n;
            
            document.getElementById('w').textContent = win;
            document.getElementById('l').textContent = total - win;
            document.getElementById('r').textContent = rate + '%';
            
            render();
        }
    }
    save();
    setTimeout(loop, 2500);
}

// ============ RENDER TABLE ============
function render(){
    let tb = document.getElementById('tb');
    let pr = D.pr || [];
    if(pr.length === 0){ tb.innerHTML = '<tr><td colspan="4">Chưa có</td></tr>'; return; }
    tb.innerHTML = pr.slice(-50).reverse().map(x => `
        <tr>
            <td>#${x.p}</td>
            <td class="${x.pr==='TAI'?'T':'X'}">${x.pr}</td>
            <td class="${x.ac==='TAI'?'T':'X'}">${x.ac}</td>
            <td class="${x.ok?'ok':'no'}">${x.ok?'✔':'✖'}</td>
        </tr>
    `).join('');
}

// ============ START ============
loop();
</script>
</body>
</html>
