<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='40' fill='%230a0a0f'/><text x='90' y='115' text-anchor='middle' font-size='90' font-weight='bold' fill='%23ffd700'>👑</text></svg>">
    <meta name="theme-color" content="#0a0a0f">
    <title>👑 PHUC SIX</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;height:100vh;overflow:hidden;font-family:Arial}
        #gf{width:100%;height:100%;border:none;position:fixed;top:0;left:0;z-index:1}
        .bw{position:fixed;z-index:9999;right:5px;top:50px;display:flex;flex-direction:column;align-items:center;gap:0}
        .bb{width:45px;height:45px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3em;box-shadow:0 2px 12px rgba(255,255,255,.3);cursor:pointer;border:none;outline:none;z-index:10000}
        .bp{background:#1a1a2e;border:1px solid #ffd700;border-radius:8px;padding:4px 10px;text-align:center;margin-bottom:2px;font-size:.6em;color:#fff;white-space:nowrap}
        .bp .pp{font-size:1.1em;font-weight:900}.pp.TAI{color:#e74c3c}.pp.XIU{color:#2ecc71}
        .bp .bi{color:#aaa;font-size:.75em}
        .bm{background:#151520;border:2px solid #ffd700;border-radius:10px;padding:8px;width:280px;display:none;text-align:center;font-size:.6em;box-shadow:0 0 25px rgba(255,215,0,.2);z-index:10001}
        .bm.show{display:block!important}
        .bm h3{color:#ffd700;font-size:.8em;margin-bottom:4px}
        .bm .st{display:flex;justify-content:space-around;margin-bottom:4px;color:#888;font-size:.75em}
        .bm .st b{color:#ffd700}
        .scroll-box{max-height:200px;overflow-y:auto}
        table{width:100%;border-collapse:collapse;font-size:.9em}
        th{background:rgba(255,255,255,.05);padding:3px 1px;color:#888}
        td{padding:3px 1px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center}
        .T{color:#e74c3c;font-weight:bold}.X{color:#2ecc71;font-weight:bold}
        .ok{color:#2ecc71}.no{color:#e74c3c}
        .key-box{text-align:center;padding:8px}
        .key-box input{width:100%;padding:8px;border:1px solid rgba(255,215,0,.3);background:#0a0a0f;color:#fff;border-radius:6px;font-size:.85em;text-align:center;letter-spacing:2px;margin-bottom:6px}
        .key-box button{width:100%;padding:8px;background:#ffd700;color:#000;border:none;border-radius:6px;font-weight:900;cursor:pointer;font-size:.85em}
        .key-box .msg{font-size:.7em;margin-top:4px}.msg.e{color:#e74c3c}.msg.s{color:#2ecc71}
    </style>
</head>
<body>

<iframe id="gf" src="https://web.sunwin.mw"></iframe>

<div class="bw" id="bw">
    <div class="bp" id="bpDiv">
        <div class="pp" id="pp">--</div>
        <div class="bi" id="bi">Đang tải...</div>
    </div>
    <button class="bb" id="bbBtn" onclick="document.getElementById('bm').classList.toggle('show');if(document.getElementById('bm').classList.contains('show')){checkKey();if(document.getElementById('mainMenu').style.display!=='none')rm();}">🤖</button>
    <div class="bm" id="bm">
        <h3>👑 PHUC SIX</h3>
        <div class="key-box" id="keyBox">
            <p style="color:#888;font-size:.75em">Nhập key</p>
            <input type="text" id="keyInput" placeholder="Nhập key..." maxlength="20">
            <button onclick="verifyKey()">🔓 MỞ KHÓA</button>
            <p class="msg" id="keyMsg"></p>
        </div>
        <div id="mainMenu" style="display:none">
            <div class="st">
                <span>Tổng: <b id="mt">0</b></span>
                <span>✅: <b id="md" style="color:#2ecc71">0</b></span>
                <span>❌: <b id="ms" style="color:#e74c3c">0</b></span>
                <span>🎯: <b id="ma">--%</b></span>
            </div>
            <div class="scroll-box">
                <table><thead><tr><th>Phiên</th><th>Dự đoán</th><th>KQ</th><th>TT</th></tr></thead>
                <tbody id="mtb"><tr><td colspan="4">Chưa có</td></tr></tbody></table>
            </div>
        </div>
    </div>
</div>

<script>
const KS='https://safely-christmas-das-classes.trycloudflare.com',AK='phuctoolnetad';
let did=localStorage.getItem('pd')||'';if(!did){did='d'+Math.random().toString(36).substr(2,9);localStorage.setItem('pd',did);}

// DRAG
let dg=!1,sx,sy,sl,st;
bw.addEventListener('pointerdown',function(e){if(e.target.closest('.bm'))return;dg=!0;sx=e.clientX;sy=e.clientY;sl=bw.offsetLeft;st=bw.offsetTop;bw.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',function(e){if(!dg)return;bw.style.left=(sl+e.clientX-sx)+'px';bw.style.top=(st+e.clientY-sy)+'px'});
document.addEventListener('pointerup',function(){dg=!1});

async function checkKey(){var sk=localStorage.getItem('pk');if(sk===AK){showMain();return;}if(sk){try{var r=await fetch(KS+'/api/check?key='+encodeURIComponent(sk)+'&device='+encodeURIComponent(did));var d=await r.json();if(d.valid){showMain();return;}}catch(e){}}showKeyInput();}
function showKeyInput(){document.getElementById('keyBox').style.display='block';document.getElementById('mainMenu').style.display='none';document.getElementById('bpDiv').style.display='none';}
function showMain(){document.getElementById('keyBox').style.display='none';document.getElementById('mainMenu').style.display='block';document.getElementById('bpDiv').style.display='block';}
async function verifyKey(){var k=document.getElementById('keyInput').value.trim();var m=document.getElementById('keyMsg');m.className='msg';m.textContent='';if(!k||k.length<7){m.className='msg e';m.textContent='❌ Key phải đủ 7 ký tự!';return;}if(k===AK){localStorage.setItem('pk',k);showMain();return;}try{var r=await fetch(KS+'/api/check?key='+encodeURIComponent(k)+'&device='+encodeURIComponent(did));var d=await r.json();if(d.valid){localStorage.setItem('pk',k);showMain();}else{m.className='msg e';m.textContent='❌ '+(d.msg||'Key không hợp lệ!');}}catch(e){m.className='msg e';m.textContent='❌ Không kết nối server!';}}

const A=['https://bracket-ellen-roads-prefer.trycloudflare.com/api/tx','https://sun-ls.onrender.com/sunlon','https://toolsunwin-gq58.onrender.com/api/ditmemaysun'];
let D={s:[],t:0,x:0,su:0,se:new Set(),pr:[],lp:''};
try{let r=localStorage.getItem('psv26');if(r){let p=JSON.parse(r);D.s=p.s||[];D.t=p.t||0;D.x=p.x||0;D.su=p.su||0;D.se=new Set(p.se||[]);D.pr=p.pr||[];D.lp=p.lp||'';}}catch(e){}
function sv(){try{localStorage.setItem('psv26',JSON.stringify({s:D.s.slice(-50000),t:D.t,x:D.x,su:D.su,se:[...D.se].slice(-50000),pr:D.pr.slice(-5000),lp:D.lp}));}catch(e){}}

function pd(s){
    let n=s.length;if(n<3)return{pr:null,cf:0};
    let r=s.map(x=>x.r),t=s.map(x=>x.t),lr=r[n-1],lt=t[n-1],sc={TAI:0,XIU:0};
    if(lt>=17)sc.TAI+=99;else if(lt<=4)sc.XIU+=98;else{
        let st=1;for(let i=n-2;i>=0;i--){if(r[i]===lr)st++;else break;}
        if(st>=7)sc[lr==='TAI'?'XIU':'TAI']+=35;else if(st>=5)sc[lr]+=25;else if(st>=3)sc[lr]+=15;else sc[lr==='TAI'?'XIU':'TAI']+=10;
        if(n>=4&&r[n-1]===r[n-3]&&r[n-2]===r[n-4]&&r[n-1]!==r[n-2])sc[r[n-2]]+=25;
        if(n>=6&&r[n-1]===r[n-2]&&r[n-3]===r[n-5]&&r[n-1]!==r[n-3])sc[r[n-3]]+=20;
        if(n>=6&&r[n-1]===r[n-2]&&r[n-3]===r[n-4]&&r[n-1]!==r[n-3])sc[r[n-3]]+=20;
        for(let i=0;i<3;i++){let v=s.map(x=>x.dc[i]),vl=v.length,lv=v[vl-1],vs=1;for(let j=vl-2;j>=0;j--){if(v[j]===lv)vs++;else break;}let bg=v.filter(x=>x>=4).length,nv=lv;if(vs>=5)nv=lv===6?5:lv+1;else if(vs>=3)nv=lv;else nv=bg>vl/2?5:2;nv=Math.max(1,Math.min(6,nv));if(nv>=4)sc.TAI+=5;else sc.XIU+=5;}
        if(lt>=14&&lt<=16)sc.TAI+=18;else if(lt>=5&&lt<=7)sc.XIU+=18;
        let l6=r.slice(-6),t6=l6.filter(x=>x==='TAI').length;if(t6>=5)sc.XIU+=12;else if(t6<=1)sc.TAI+=12;
        if(n>=8){let l3=r.slice(-3).join(''),mt=0,mx=0;for(let i=0;i<=n-4;i++){if(r.slice(i,i+3).join('')===l3){r[i+3]==='TAI'?mt++:mx++;}}if(mt+mx>=4){if(mt>mx)sc.TAI+=14;else sc.XIU+=14;}}
    }
    return{pr:sc.TAI>sc.XIU?'TAI':'XIU',cf:Math.min(99,Math.max(55,Math.round(Math.max(sc.TAI,sc.XIU)/(sc.TAI+sc.XIU)*100)))};
}

async function up(){
    let res=[];
    for(let a of A){try{let r=await fetch(a,{signal:AbortSignal.timeout(5000)});let d=await r.json();
    if(d?.phien&&d.xuc_xac_1!==undefined)res.push({p:String(d.phien),dc:[d.xuc_xac_1,d.xuc_xac_2,d.xuc_xac_3],t:d.tong,r:(d.ket_qua==='Tài'||d.ket_qua==='TAI')?'TAI':'XIU'});
    if(d?.phien_hien_tai&&d.xuc_xac_1!==undefined)res.push({p:String(d.phien_hien_tai),dc:[d.xuc_xac_1,d.xuc_xac_2,d.xuc_xac_3],t:d.tong,r:(d.ket_qua==='Tài'||d.ket_qua==='TAI')?'TAI':'XIU'});
    if(d?.Phien&&d.Xuc_xac_1!==undefined)res.push({p:String(d.Phien),dc:[d.Xuc_xac_1,d.Xuc_xac_2,d.Xuc_xac_3],t:d.Tong,r:d.Ket_qua==='Tài'?'TAI':'XIU'});}catch(e){}}
    for(let i of res){if(!D.se.has(i.p)){D.se.add(i.p);if(D.lp&&D.s.length>0){let l=D.s[D.s.length-1];if(parseInt(i.p)===parseInt(l.p)+1){D.pr.push({p:i.p,pr:D.lp,ac:i.r,ok:D.lp===i.r});}}D.s.push(i);D.su+=i.t;i.r==='TAI'?D.t++:D.x++;}}
    D.s.sort((a,b)=>parseInt(a.p)-parseInt(b.p));
    if(D.s.length>=3){let p=pd(D.s);if(p.pr){D.lp=p.pr;document.getElementById('pp').textContent=p.pr==='TAI'?'🔴 TÀI':'🟢 XỈU';document.getElementById('pp').className='pp '+p.pr;document.getElementById('bi').textContent='#'+(parseInt(D.s[D.s.length-1].p)+1)+' | '+p.cf+'%';}}
    sv();if(document.getElementById('bm').classList.contains('show')&&document.getElementById('mainMenu').style.display!=='none')rm();
}

function rm(){
    let pr=D.pr,tp=pr.length,cp=pr.filter(p=>p.ok).length;
    document.getElementById('mt').textContent=tp;document.getElementById('md').textContent=cp;document.getElementById('ms').textContent=tp-cp;document.getElementById('ma').textContent=tp>0?Math.round(cp/tp*100)+'%':'--%';
    let tb=document.getElementById('mtb');if(pr.length===0)tb.innerHTML='<tr><td colspan="4">Chưa có</td></tr>';
    else tb.innerHTML=[...pr].reverse().slice(0,100).map(p=>`<tr><td>#${p.p}</td><td class="${p.pr==='TAI'?'T':'X'}">${p.pr}</td><td class="${p.ac==='TAI'?'T':'X'}">${p.ac}</td><td class="${p.ok?'ok':'no'}">${p.ok?'✅':'❌'}</td></tr>`).join('');
}

checkKey();up();setInterval(up,4000);
</script>
</body>
</html>
