<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PHUC SIX HEX · PHÂN TÍCH 2 BIỂU ĐỒ</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0f1a 0%, #061218 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Nunito', system-ui, sans-serif;
            padding: 20px;
        }
        .phucsix-menu {
            max-width: 1000px;
            width: 100%;
            background: rgba(8, 20, 25, 0.95);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 180, 0.4);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .phucsix-header {
            background: linear-gradient(115deg, #0a2a22 0%, #051a12 100%);
            padding: 12px 18px;
            border-bottom: 2px solid rgba(0, 255, 180, 0.5);
        }
        .phucsix-header h1 {
            color: #00ffb3;
            font-size: 1.3rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .phucsix-header small {
            font-size: 0.6rem;
            background: #1a4a3a;
            padding: 3px 10px;
            border-radius: 40px;
            color: #ccffdd;
        }
        .phucsix-body {
            padding: 18px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .result-box {
            background: linear-gradient(125deg, #001f1a, #000c08);
            border-radius: 24px;
            padding: 14px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 180, 0.4);
        }
        .result-label { font-size: 0.65rem; letter-spacing: 2px; color: #77ffcc; }
        .result-value { font-size: 2.8rem; font-weight: 900; margin: 6px 0; }
        .result-value.TAI { color: #ff5e5e; text-shadow: 0 0 10px #ff4d4d; }
        .result-value.XIU { color: #5eff9e; text-shadow: 0 0 10px #33ff88; }
        .confidence { font-size: 0.7rem; background: #0a2f26; display: inline-block; padding: 3px 14px; border-radius: 40px; color: #bbffdd; }

        .chart-box { margin-bottom: 20px; }
        .chart-title {
            font-size: 0.65rem;
            font-weight: 700;
            color: #ffdb7e;
            margin-bottom: 6px;
            padding-left: 8px;
            border-left: 3px solid #ffc107;
        }
        canvas {
            background: #071a1a;
            border-radius: 14px;
            padding: 6px;
            width: 100%;
            height: 170px;
            border: 1px solid #2a6b55;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin: 15px 0 15px;
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(95deg, #00cc88, #008866);
            border: none;
            padding: 9px 0;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            color: #021c14;
            cursor: pointer;
        }
        .btn-secondary {
            flex: 1;
            background: rgba(0, 255, 180, 0.12);
            border: 1px solid #2a8f70;
            padding: 9px 0;
            border-radius: 50px;
            font-weight: 700;
            color: #b3ffe0;
            cursor: pointer;
        }
        .analysis-detail {
            background: #071a14;
            border-radius: 20px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.7rem;
            line-height: 1.4;
            border-left: 4px solid #ffdb7e;
            color: #cce6dd;
        }
        .status {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 15px;
            padding-top: 8px;
            border-top: 1px dashed #2a6b55;
            color: #4fba97;
        }
        @media (max-width: 680px) {
            .phucsix-body { padding: 12px; }
            .result-value { font-size: 2rem; }
            canvas { height: 130px; }
        }
    </style>
</head>
<body>
<div class="phucsix-menu">
    <div class="phucsix-header">
        <h1>🎲 PHUC SIX HEX · TÀI XỈU <small>PHÂN TÍCH 2 BIỂU ĐỒ</small></h1>
    </div>
    <div class="phucsix-body">
        <div class="result-box">
            <div class="result-label">🎯 DỰ ĐOÁN PHIÊN TIẾP THEO</div>
            <div class="result-value" id="mainResult">--</div>
            <div class="confidence" id="mainConf">🔮 ĐỘ TIN CẬY: --%</div>
        </div>

        <div class="chart-box">
            <div class="chart-title">📊 BIỂU ĐỒ TỔNG ĐIỂM 20 PHIÊN GẦN NHẤT</div>
            <canvas id="totalChart"></canvas>
        </div>
        <div class="chart-box">
            <div class="chart-title">🎲 BIỂU ĐỒ 3 MẶT XÍ NGẦU (Tím ➖ Vàng ➖ Đỏ)</div>
            <canvas id="diceChart"></canvas>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="analyzeBtn">🧠 PHÂN TÍCH CẦU</button>
            <button class="btn-secondary" id="refreshBtn">🔄 CẬP NHẬT DỮ LIỆU</button>
        </div>

        <div class="analysis-detail" id="analysisDetail">
            ✨ Bấm "PHÂN TÍCH CẦU" để phân tích 2 biểu đồ.<br>
            🔄 Bấm "CẬP NHẬT DỮ LIỆU" để tải phiên mới từ VPS.
        </div>
        <div class="status" id="statusText">🟢 ĐANG KẾT NỐI VPS...</div>
    </div>
</div>

<script>
    const API = 'https://isa-accomplish-fork-capitol.trycloudflare.com/api/history';
    const SIMILARITY = 25;
    
    let fullHistory = [];
    let current20 = [];
    let totalChart = null, diceChart = null;

    function getTaiXiu(total) {
        if (total >= 4 && total <= 10) return 'XỈU';
        if (total >= 11 && total <= 17) return 'TÀI';
        return '?';
    }
    function getTotal(s) { let d = s.dice || s.dc; return d[0] + d[1] + d[2]; }
    function getDiceArray(s) { return s.dice || s.dc; }
    function diceKey(d) { return d.join(','); }

    function calcSimilarity(arrA, arrB) {
        if (arrA.length !== arrB.length) return 0;
        let same = 0;
        for (let i = 0; i < arrA.length; i++) if (arrA[i] === arrB[i]) same++;
        return (same / arrA.length) * 100;
    }

    async function fetchData() {
        try {
            const res = await fetch(API);
            const json = await res.json();
            let all = json.sessions || [];
            all.sort((a,b) => parseInt(a.phien) - parseInt(b.phien));
            fullHistory = all;
            current20 = fullHistory.slice(-20);
            document.getElementById('statusText').innerHTML = `🟢 VPS | ${fullHistory.length} phiên`;
            return true;
        } catch(e) {
            document.getElementById('statusText').innerHTML = `🔴 LỖI: ${e.message}`;
            return false;
        }
    }

    function drawCharts() {
        if (!current20.length) return;
        let totals = current20.map(s => getTotal(s));
        let d1 = current20.map(s => getDiceArray(s)[0]);
        let d2 = current20.map(s => getDiceArray(s)[1]);
        let d3 = current20.map(s => getDiceArray(s)[2]);
        let labels = totals.map((_,i) => i+1);

        if (totalChart) totalChart.destroy();
        totalChart = new Chart(document.getElementById('totalChart'), {
            type: 'line',
            data: { labels, datasets: [{ label: 'Tổng điểm', data: totals, borderColor: '#f7b32b', borderWidth: 2.5, pointRadius: 4, tension: 0.2, fill: true }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#ccc', font: { size: 9 } } } }, scales: { y: { min: 3, max: 18 }, x: { ticks: { color: '#bbb' } } } }
        });

        if (diceChart) diceChart.destroy();
        diceChart = new Chart(document.getElementById('diceChart'), {
            type: 'line',
            data: { labels, datasets: [
                { label: 'Tím', data: d1, borderColor: '#b77cff', borderWidth: 2, tension: 0.2 },
                { label: 'Vàng', data: d2, borderColor: '#fac05e', borderWidth: 2, tension: 0.2 },
                { label: 'Đỏ', data: d3, borderColor: '#ff7359', borderWidth: 2, tension: 0.2 }
            ] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top', labels: { color: '#ccc', font: { size: 8 } } } }, scales: { y: { min: 1, max: 6 }, x: { ticks: { color: '#bbb' } } } }
        });
    }

    // PHÂN TÍCH TỔNG ĐIỂM
    function analyzeTotalPoints() {
        if (current20.length < 10) return { prediction: '?', confidence: 0, details: 'Chưa đủ 20 phiên', totalMatches: 0 };
        
        let targetTotals = current20.map(s => getTotal(s));
        let lastNumber = targetTotals[targetTotals.length-1];
        let matchedNext = [];
        
        for (let i = 0; i <= fullHistory.length - 21; i++) {
            let histTotals = [];
            for (let j = 0; j < 20; j++) {
                let d = getDiceArray(fullHistory[i+j]);
                histTotals.push(d[0]+d[1]+d[2]);
            }
            if (histTotals[19] !== lastNumber) continue;
            let sim = calcSimilarity(targetTotals, histTotals);
            if (sim >= SIMILARITY) {
                let next = getDiceArray(fullHistory[i+20]);
                matchedNext.push(next[0]+next[1]+next[2]);
            }
        }
        
        let tai = matchedNext.filter(t => t >= 11).length;
        let xiu = matchedNext.filter(t => t <= 10).length;
        let total = matchedNext.length;
        let pred = (tai > xiu) ? 'TÀI' : (xiu > tai) ? 'XỈU' : '?';
        let conf = total ? Math.round(Math.max(tai,xiu)/total*100) : 0;
        
        return {
            prediction: pred,
            confidence: conf,
            details: `📊 Tìm được ${total} cầu (độ tương đồng ≥ ${SIMILARITY}%) | Sau số ${lastNumber}: Tài ${tai} lần, Xỉu ${xiu} lần`,
            totalMatches: total, tai, xiu
        };
    }

    // PHÂN TÍCH BỘ XÍ NGẦU CUỐI
    function analyzeLastDice() {
        if (current20.length < 1) return { prediction: '?', confidence: 0, details: 'Chưa có dữ liệu', totalMatches: 0 };
        
        let lastDice = getDiceArray(current20[current20.length-1]);
        let lastKey = diceKey(lastDice);
        let matchedNext = [];
        
        for (let i = 0; i <= fullHistory.length - 2; i++) {
            let curDice = getDiceArray(fullHistory[i]);
            if (diceKey(curDice) === lastKey) {
                let nextDice = getDiceArray(fullHistory[i+1]);
                matchedNext.push(nextDice[0]+nextDice[1]+nextDice[2]);
            }
        }
        
        let tai = matchedNext.filter(t => t >= 11).length;
        let xiu = matchedNext.filter(t => t <= 10).length;
        let total = matchedNext.length;
        let pred = (tai > xiu) ? 'TÀI' : (xiu > tai) ? 'XỈU' : '?';
        let conf = total ? Math.round(Math.max(tai,xiu)/total*100) : 0;
        
        return {
            prediction: pred,
            confidence: conf,
            details: `🎲 Bộ xí ngầu [${lastDice.join(',')}] xuất hiện ${total} lần trong lịch sử | Sau đó: Tài ${tai} lần, Xỉu ${xiu} lần`,
            totalMatches: total, tai, xiu
        };
    }

    // KẾT HỢP 2 PHÂN TÍCH
    function combineResults(totalRes, diceRes) {
        // Ưu tiên bên nào có nhiều mẫu hơn
        if (totalRes.totalMatches >= 3 && totalRes.totalMatches >= diceRes.totalMatches) {
            return {
                prediction: totalRes.prediction,
                confidence: totalRes.confidence,
                method: 'TỔNG ĐIỂM (quét lịch sử)',
                detail: totalRes.details
            };
        } else if (diceRes.totalMatches >= 2) {
            return {
                prediction: diceRes.prediction,
                confidence: diceRes.confidence,
                method: 'BỘ XÍ NGẦU CUỐI (quét lịch sử)',
                detail: diceRes.details
            };
        } else {
            // Nếu cả 2 đều ít mẫu, ưu tiên cái nào có mẫu hơn
            if (totalRes.totalMatches > diceRes.totalMatches) {
                return {
                    prediction: totalRes.prediction,
                    confidence: totalRes.confidence,
                    method: 'TỔNG ĐIỂM (ít mẫu)',
                    detail: totalRes.details
                };
            } else if (diceRes.totalMatches > 0) {
                return {
                    prediction: diceRes.prediction,
                    confidence: diceRes.confidence,
                    method: 'BỘ XÍ NGẦU (ít mẫu)',
                    detail: diceRes.details
                };
            } else {
                return {
                    prediction: '?',
                    confidence: 0,
                    method: 'KHÔNG ĐỦ DỮ LIỆU',
                    detail: 'Không tìm thấy cầu trùng trong lịch sử'
                };
            }
        }
    }

    async function analyze() {
        if (current20.length < 10) {
            document.getElementById('analysisDetail').innerHTML = '⚠️ Chưa đủ 20 phiên, bấm CẬP NHẬT DỮ LIỆU.';
            return;
        }
        if (fullHistory.length === 0) await fetchData();
        
        document.getElementById('analysisDetail').innerHTML = '🔍 ĐANG PHÂN TÍCH LỊCH SỬ...';
        
        let totalRes = analyzeTotalPoints();
        let diceRes = analyzeLastDice();
        let final = combineResults(totalRes, diceRes);
        
        document.getElementById('mainResult').innerText = final.prediction;
        document.getElementById('mainResult').className = `result-value ${final.prediction === 'TÀI' ? 'TAI' : 'XIU'}`;
        document.getElementById('mainConf').innerHTML = `🎲 ĐỘ TIN CẬY: ${final.confidence}% | Dựa trên ${final.method}`;
        
        let detail = `
            📊 PHÂN TÍCH BIỂU ĐỒ TỔNG ĐIỂM:<br>
            &nbsp;&nbsp;${totalRes.details}<br><br>
            🎲 PHÂN TÍCH BIỂU ĐỒ 3 MẶT XÍ NGẦU:<br>
            &nbsp;&nbsp;${diceRes.details}<br><br>
            🧠 KẾT LUẬN: <strong style="color:${final.prediction==='TÀI'?'#ff5e5e':'#5eff9e'}">${final.prediction}</strong> (${final.confidence}%)<br>
            📌 Ưu tiên phương pháp: ${final.method}
        `;
        document.getElementById('analysisDetail').innerHTML = detail;
    }
    
    async function refresh() {
        document.getElementById('analysisDetail').innerHTML = '⏳ ĐANG CẬP NHẬT DỮ LIỆU TỪ VPS...';
        await fetchData();
        if (fullHistory.length >= 20) {
            current20 = fullHistory.slice(-20);
            drawCharts();
            document.getElementById('analysisDetail').innerHTML = `✅ ĐÃ CẬP NHẬT ${fullHistory.length} phiên. Bấm "PHÂN TÍCH CẦU" để dự đoán.`;
        } else {
            document.getElementById('analysisDetail').innerHTML = '⚠️ CHƯA ĐỦ 20 PHIÊN.';
        }
        document.getElementById('statusText').innerHTML = `🟢 VPS | ${fullHistory.length} phiên`;
    }
    
    document.getElementById('analyzeBtn').onclick = analyze;
    document.getElementById('refreshBtn').onclick = refresh;
    
    (async () => {
        await fetchData();
        if (fullHistory.length >= 20) {
            current20 = fullHistory.slice(-20);
            drawCharts();
        }
        setInterval(async () => {
            let oldLen = fullHistory.length;
            await fetchData();
            if (fullHistory.length > oldLen) {
                current20 = fullHistory.slice(-20);
                drawCharts();
                document.getElementById('statusText').innerHTML = `🟢 VPS | ${fullHistory.length} phiên | Tự cập nhật`;
            }
        }, 15000);
    })();
</script>
</body>
</html>
