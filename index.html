<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='40' fill='%230a0a0f'/><text x='90' y='115' text-anchor='middle' font-size='90' font-weight='bold' fill='%23ffd700'>👑</text></svg>">
    <meta name="theme-color" content="#0a0a0f">
    <title>👑 PHUC SIX</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;height:100vh;overflow:hidden;font-family:'Segoe UI',Arial}
        #gf{width:100%;height:100%;border:none;position:fixed;top:0;left:0;z-index:1}
        
        .bw{position:fixed;z-index:9999;right:8px;top:80px;display:flex;flex-direction:column;align-items:center;gap:0}
        .bb{width:55px;height:55px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6em;box-shadow:0 0 25px rgba(255,215,0,.35);animation:fl 3s infinite;cursor:pointer;z-index:2}
        @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
        .bp{background:#1a1a2e;border:1px solid #ffd700;border-radius:10px;padding:6px 14px;text-align:center;margin-bottom:4px;font-size:.7em;color:#fff}
        .bp .pp{font-size:1.3em;font-weight:900}.pp.TAI{color:#e74c3c}.pp.XIU{color:#2ecc71}
        .bp .bi{color:#aaa;font-size:.8em;margin-top:1px}
        
        .bm{background:#151520;border:2px solid #ffd700;border-radius:12px;padding:12px;width:300px;max-height:380px;overflow-y:auto;display:none;text-align:center;font-size:.65em;box-shadow:0 0 30px rgba(255,215,0,.25);z-index:1}
        .bm.show{display:block}
        .bm h3{color:#ffd700;font-size:.9em;margin-bottom:8px}
        .bm .st{display:flex;justify-content:space-around;margin-bottom:8px;color:#888;font-size:.75em}
        .bm .st b{color:#ffd700}
        table{width:100%;border-collapse:collapse;font-size:.9em}
        th{background:rgba(255,255,255,.05);padding:5px 3px;color:#888}
        td{padding:5px 3px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center}
        .T{color:#e74c3c;font-weight:bold}.X{color:#2ecc71;font-weight:bold}
        .ok{color:#2ecc71;font-weight:bold}.no{color:#e74c3c;font-weight:bold}
    </style>
</head>
<body>

<iframe id="gf" src="https://web.sunwin.mw"></iframe>

<div class="bw" id="bw">
    <div class="bp">
        <div class="pp" id="pp">--</div>
        <div class="bi" id="bi">Đang tải...</div>
    </div>
    <div class="bb" onclick="document.getElementById('bm').classList.toggle('show');if(document.getElementById('bm').classList.contains('show'))rm()">🤖</div>
    <div class="bm" id="bm">
        <h3>📋 LỊCH SỬ DỰ ĐOÁN PHUC SIX</h3>
        <div class="st">
            <span>Tổng: <b id="mt">0</b></span>
            <span>✅ Đúng: <b id="md" style="color:#2ecc71">0</b></span>
            <span>❌ Sai: <b id="ms" style="color:#e74c3c">0</b></span>
            <span>🎯 CX: <b id="ma">--%</b></span>
        </div>
        <table>
            <thead><tr><th>Phiên</th><th>Dự đoán</th><th>KQ</th><th>TT</th></tr></thead>
            <tbody id="mtb"><tr><td colspan="4" style="color:#888">Chưa có dữ liệu</td></tr></tbody>
        </table>
    </div>
</div>

<script>
const A=['https://bracket-ellen-roads-prefer.trycloudflare.com/api/tx','https://sun-ls.onrender.com/sunlon','https://toolsunwin-gq58.onrender.com/api/ditmemaysun'];
let D={s:[],t:0,x:0,su:0,se:new Set(),pr:[],lp:''};
try{let r=localStorage.getItem('psx');if(r){let p=JSON.parse(r);D.s=p.s||[];D.t=p.t||0;D.x=p.x||0;D.su=p.su||0;D.se=new Set(p.se||[]);D.pr=p.pr||[];D.lp=p.lp||'';}}catch(e){}
function sv(){try{localStorage.setItem('psx',JSON.stringify({s:D.s.slice(-50000),t:D.t,x:D.x,su:D.su,se:[...D.se].slice(-50000),pr:D.pr.slice(-5000),lp:D.lp}));}catch(e){}}
let cd=4;

// DRAG
const bw=document.getElementById('bw');let dg=!1,sx,sy,sl,st;
bw.addEventListener('mousedown',e=>{if(e.target.closest('.bm'))return;dg=!0;sx=e.clientX;sy=e.clientY;sl=bw.offsetLeft;st=bw.offsetTop});
bw.addEventListener('touchstart',e=>{if(e.target.closest('.bm'))return;dg=!0;sx=e.touches[0].clientX;sy=e.touches[0].clientY;sl=bw.offsetLeft;st=bw.offsetTop});
document.addEventListener('mousemove',e=>{if(!dg)return;bw.style.left=(sl+e.clientX-sx)+'px';bw.style.top=(st+e.clientY-sy)+'px'});
document.addEventListener('touchmove',e=>{if(!dg)return;bw.style.left=(sl+e.touches[0].clientX-sx)+'px';bw.style.top=(st+e.touches[0].clientY-sy)+'px'});
document.addEventListener('mouseup',()=>dg=!1);document.addEventListener('touchend',()=>dg=!1);

function pd(s){
    let n=s.length;if(n<3)return{pr:null,cf:0,rs:'Cần '+(3-n)+' phiên'};
    let r=s.map(x=>x.r),t=s.map(x=>x.t),d=s.map(x=>x.dc);
    let lr=r[n-1],lt=t[n-1],ld=d[n-1];
    let sc={TAI:0,XIU:0},rs=[];
    
    // Cực trị
    if(lt>=17){sc.TAI+=99;rs.push('Tổng≥17');}
    if(lt<=4){sc.XIU+=98;rs.push('Tổng≤4');}
    
    // Bệt linh hoạt
    let st=1;for(let i=n-2;i>=0;i--){if(r[i]===lr)st++;else break;}
    if(st>=7){sc[lr==='TAI'?'XIU':'TAI']+=35;rs.push('Bệt'+st+'→ĐẢO');}
    else if(st>=5){sc[lr]+=25;rs.push('Bệt'+st+'→THEO');}
    else if(st>=3){sc[lr]+=15;rs.push('Bệt'+st);}
    else{sc[lr==='TAI'?'XIU':'TAI']+=10;rs.push('Xen kẽ');}
    
    // Cầu
    if(n>=4&&r[n-1]===r[n-3]&&r[n-2]===r[n-4]&&r[n-1]!==r[n-2]){sc[r[n-2]]+=25;rs.push('1-1');}
    if(n>=6&&r[n-1]===r[n-2]&&r[n-3]===r[n-5]&&r[n-1]!==r[n-3]){sc[r[n-3]]+=20;rs.push('2-1');}
    if(n>=6&&r[n-1]===r[n-2]&&r[n-3]===r[n-4]&&r[n-1]!==r[n-3]){sc[r[n-3]]+=20;rs.push('2-2');}
    
    // Xí ngầu độc lập
    for(let i=0;i<3;i++){
        let v=s.map(x=>x.dc[i]),vl=v.length,lv=v[vl-1],pv=v[vl-2]||lv,pv2=v[vl-3]||pv;
        let vs=1;for(let j=vl-2;j>=0;j--){if(v[j]===lv)vs++;else break;}
        let bg=v.filter(x=>x>=4).length,sm=vl-bg;
        let l3=v.slice(-3).join(','),fd=[];
        for(let j=0;j<vl-3;j++){if(v.slice(j,j+3).join(',')===l3&&j+3<vl)fd.push(v[j+3]);}
        let nv=lv;
        if(vs>=5)nv=lv===6?5:lv+1;
        else if(vs>=3)nv=lv;
        else if(fd.length>=2)nv=Math.round(fd.reduce((a,b)=>a+b,0)/fd.length);
        else nv=bg>sm?Math.round(4+Math.random()):Math.round(2+Math.random());
        nv=Math.max(1,Math.min(6,nv));
        if(nv>=4)sc.TAI+=5;else sc.XIU+=5;
    }
    
    // Điểm
    if(lt>=14&&lt<=16){sc.TAI+=18;rs.push('Cao→TÀI');}
    else if(lt>=5&&lt<=7){sc.XIU+=18;rs.push('Thấp→XỈU');}
    
    // Xu hướng
    let l6=r.slice(-6),t6=l6.filter(x=>x==='TAI').length;
    if(t6>=5){sc.XIU+=12;rs.push(t6+'/6T');}
    else if(t6<=1){sc.TAI+=12;rs.push((6-t6)+'/6X');}
    
    // Pattern
    if(n>=8){let l3=r.slice(-3).join(''),mt=0,mx=0;for(let i=0;i<=n-4;i++){if(r.slice(i,i+3).join('')===l3){r[i+3]==='TAI'?mt++:mx++;}}if(mt+mx>=4){if(mt>mx){sc.TAI+=14;rs.push('Pattern→TÀI');}else{sc.XIU+=14;rs.push('Pattern→XỈU');}}}
    
    let pr=sc.TAI>sc.XIU?'TAI':'XIU',tot=sc.TAI+sc.XIU;
    return{pr,cf:tot>0?Math.min(99,Math.max(55,Math.round(Math.max(sc.TAI,sc.XIU)/tot*100))):50,rs:rs.slice(0,3).join(' | ')};
}

async function up(){
    let res=[];
    for(let a of A){try{let r=await fetch(a,{signal:AbortSignal.timeout(5000)});let d=await r.json();
    if(d?.phien&&d.xuc_xac_1!==undefined)res.push({p:String(d.phien),dc:[d.xuc_xac_1,d.xuc_xac_2,d.xuc_xac_3],t:d.tong,r:(d.ket_qua==='Tài'||d.ket_qua==='TAI')?'TAI':'XIU'});
    if(d?.phien_hien_tai&&d.xuc_xac_1!==undefined)res.push({p:String(d.phien_hien_tai),dc:[d.xuc_xac_1,d.xuc_xac_2,d.xuc_xac_3],t:d.tong,r:(d.ket_qua==='Tài'||d.ket_qua==='TAI')?'TAI':'XIU'});
    if(d?.Phien&&d.Xuc_xac_1!==undefined)res.push({p:String(d.Phien),dc:[d.Xuc_xac_1,d.Xuc_xac_2,d.Xuc_xac_3],t:d.Tong,r:d.Ket_qua==='Tài'?'TAI':'XIU'});}catch(e){}}
    for(let i of res){if(!D.se.has(i.p)){D.se.add(i.p);if(D.lp&&D.s.length>0){let l=D.s[D.s.length-1];if(parseInt(i.p)===parseInt(l.p)+1){D.pr.push({p:i.p,pr:D.lp,ac:i.r,ok:D.lp===i.r});}}D.s.push(i);D.su+=i.t;i.r==='TAI'?D.t++:D.x++;}}
    D.s.sort((a,b)=>parseInt(a.p)-parseInt(b.p));
    if(D.s.length>=3){let p=pd(D.s);if(p.pr){D.lp=p.pr;document.getElementById('pp').textContent=p.pr==='TAI'?'🔴 TÀI':'🟢 XỈU';document.getElementById('pp').className='pp '+p.pr;document.getElementById('bi').textContent='#'+(parseInt(D.s[D.s.length-1].p)+1)+' | '+p.cf+'% | '+p.rs;}}
    sv();if(document.getElementById('bm').classList.contains('show'))rm();
}

function rm(){
    let pr=D.pr,tp=pr.length,cp=pr.filter(p=>p.ok).length;
    document.getElementById('mt').textContent=tp;document.getElementById('md').textContent=cp;
    document.getElementById('ms').textContent=tp-cp;document.getElementById('ma').textContent=tp>0?Math.round(cp/tp*100)+'%':'--%';
    let tb=document.getElementById('mtb');
    if(pr.length===0)tb.innerHTML='<tr><td colspan="4">Chưa có</td></tr>';
    else tb.innerHTML=[...pr].reverse().slice(0,50).map(p=>`<tr><td>#${p.p}</td><td class="${p.pr==='TAI'?'T':'X'}">${p.pr}</td><td class="${p.ac==='TAI'?'T':'X'}">${p.ac}</td><td class="${p.ok?'ok':'no'}">${p.ok?'✅':'❌'}</td></tr>`).join('');
}

up();setInterval(up,4000);
</script>
</body>
</html>
