<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>PHUC SIX HEX · TÀI XỈU · PHÂN TÍCH TỔNG ĐIỂM + BỘ XÍ NGẦU</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0a0f1a 0%, #061218 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Nunito', system-ui, sans-serif;
            padding: 20px;
        }
        .phucsix-menu {
            max-width: 1000px;
            width: 100%;
            background: rgba(8, 20, 25, 0.95);
            backdrop-filter: blur(14px);
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 180, 0.4);
            box-shadow: 0 25px 45px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .phucsix-header {
            background: linear-gradient(115deg, #0a2a22 0%, #051a12 100%);
            padding: 14px 20px;
            border-bottom: 2px solid rgba(0, 255, 180, 0.5);
        }
        .phucsix-header h1 {
            color: #00ffb3;
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .phucsix-header small {
            font-size: 0.65rem;
            background: #1a4a3a;
            padding: 4px 12px;
            border-radius: 40px;
            color: #ccffdd;
        }
        .phucsix-body {
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .phucsix-body::-webkit-scrollbar { width: 5px; }
        .phucsix-body::-webkit-scrollbar-track { background: #0a2a22; border-radius: 10px; }
        .phucsix-body::-webkit-scrollbar-thumb { background: #00ffb3; border-radius: 10px; }

        .result-box {
            background: linear-gradient(125deg, #001f1a, #000c08);
            border-radius: 28px;
            padding: 16px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 180, 0.4);
        }
        .result-label { font-size: 0.7rem; letter-spacing: 2px; color: #77ffcc; }
        .result-value { font-size: 3rem; font-weight: 900; margin: 8px 0; }
        .result-value.TAI { color: #ff5e5e; text-shadow: 0 0 12px #ff4d4d; }
        .result-value.XIU { color: #5eff9e; text-shadow: 0 0 12px #33ff88; }
        .confidence { font-size: 0.75rem; background: #0a2f26; display: inline-block; padding: 4px 16px; border-radius: 40px; color: #bbffdd; }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .stats-card {
            background: #071f19;
            padding: 5px 14px;
            border-radius: 32px;
            border: 1px solid #2a6b55;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .win { color: #5eff9e; }
        .lose { color: #ff7777; }

        .chart-box { margin-bottom: 25px; }
        .chart-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: #ffdb7e;
            margin-bottom: 8px;
            padding-left: 10px;
            border-left: 3px solid #ffc107;
        }
        canvas {
            background: #071a1a;
            border-radius: 18px;
            padding: 8px;
            width: 100%;
            height: 190px;
            border: 1px solid #2a6b55;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin: 18px 0 18px;
            flex-wrap: wrap;
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(95deg, #00cc88, #008866);
            border: none;
            padding: 11px 0;
            border-radius: 60px;
            font-weight: 800;
            font-size: 0.95rem;
            color: #021c14;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 18px rgba(0,255,180,0.4); }
        .btn-secondary {
            flex: 1;
            background: rgba(0, 255, 180, 0.12);
            border: 1px solid #2a8f70;
            padding: 11px 0;
            border-radius: 60px;
            font-weight: 700;
            color: #b3ffe0;
            cursor: pointer;
        }
        .analysis-detail {
            background: #071a14;
            border-radius: 22px;
            padding: 14px;
            margin-top: 12px;
            font-size: 0.75rem;
            line-height: 1.5;
            border-left: 5px solid #ffdb7e;
            color: #cce6dd;
        }
        .status {
            font-size: 0.65rem;
            text-align: center;
            margin-top: 18px;
            padding-top: 10px;
            border-top: 1px dashed #2a6b55;
            color: #4fba97;
        }
        @media (max-width: 680px) {
            .phucsix-body { padding: 12px; }
            .result-value { font-size: 2.2rem; }
            canvas { height: 140px; }
        }
    </style>
</head>
<body>
<div class="phucsix-menu">
    <div class="phucsix-header">
        <h1>🎲 PHUC SIX HEX · TÀI XỈU <small>⚡ TỔNG ĐIỂM + BỘ XÍ NGẦU</small></h1>
    </div>
    <div class="phucsix-body">
        <div class="result-box">
            <div class="result-label">🎯 DỰ ĐOÁN PHIÊN TIẾP THEO</div>
            <div class="result-value" id="mainResult">--</div>
            <div class="confidence" id="mainConf">🔮 ĐỘ TIN CẬY: --%</div>
            <div class="stats">
                <div class="stats-card">✅ ĐÚNG: <span class="win" id="winCount">0</span></div>
                <div class="stats-card">❌ SAI: <span class="lose" id="loseCount">0</span></div>
                <div class="stats-card">📊 TỈ LỆ ĐÚNG: <span id="winRate">0%</span></div>
            </div>
        </div>

        <div class="chart-box">
            <div class="chart-title">📊 BIỂU ĐỒ TỔNG ĐIỂM 20 PHIÊN GẦN NHẤT</div>
            <canvas id="totalChart"></canvas>
        </div>
        <div class="chart-box">
            <div class="chart-title">🎲 BIỂU ĐỒ 3 MẶT XÍ NGẦU (Tím - Vàng - Đỏ)</div>
            <canvas id="diceChart"></canvas>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="analyzeBtn">🧠 PHÂN TÍCH CẦU</button>
            <button class="btn-secondary" id="refreshBtn">🔄 CẬP NHẬT</button>
        </div>

        <div class="analysis-detail" id="analysisDetail">
            ✨ Bấm "PHÂN TÍCH CẦU" để phân tích tổng điểm + bộ xí ngầu.
        </div>
        <div class="status" id="statusText">🟢 ĐANG KẾT NỐI VPS...</div>
    </div>
</div>

<script>
    const API = 'https://isa-accomplish-fork-capitol.trycloudflare.com/api/history';
    const SIMILARITY = 25; // 25% cho tổng điểm
    const DICE_MATCH_EXACT = true; // bộ xí ngầu cuối phải trùng 100%
    
    let fullHistory = [];
    let current20 = [];
    let predictionsLog = [];
    let totalChart = null, diceChart = null;

    function getTaiXiu(total) {
        if (total >= 4 && total <= 10) return 'XỈU';
        if (total >= 11 && total <= 17) return 'TÀI';
        return '?';
    }
    function getTotal(s) { let d = s.dice || s.dc; return d[0] + d[1] + d[2]; }
    function getDiceArray(s) { return s.dice || s.dc; }

    // Tương tự cũ (giữ nguyên)
    function calcSimilarity(arrA, arrB) {
        if (arrA.length !== arrB.length) return 0;
        let same = 0;
        for (let i = 0; i < arrA.length; i++) if (arrA[i] === arrB[i]) same++;
        return (same / arrA.length) * 100;
    }

    async function fetchData() {
        try {
            const res = await fetch(API);
            const json = await res.json();
            let all = json.sessions || [];
            all.sort((a,b) => parseInt(a.phien) - parseInt(b.phien));
            fullHistory = all;
            current20 = fullHistory.slice(-20);
            document.getElementById('statusText').innerHTML = `🟢 VPS | ${fullHistory.length} phiên | Đã sẵn sàng`;
            return true;
        } catch(e) {
            document.getElementById('statusText').innerHTML = `🔴 LỖI: ${e.message}`;
            return false;
        }
    }

    function drawCharts() {
        if (!current20.length) return;
        let totals = current20.map(s => getTotal(s));
        let d1 = current20.map(s => getDiceArray(s)[0]);
        let d2 = current20.map(s => getDiceArray(s)[1]);
        let d3 = current20.map(s => getDiceArray(s)[2]);
        let labels = totals.map((_,i) => i+1);

        if (totalChart) totalChart.destroy();
        totalChart = new Chart(document.getElementById('totalChart'), {
            type: 'line',
            data: { labels, datasets: [{ label: 'Tổng điểm', data: totals, borderColor: '#f7b32b', borderWidth: 2.5, pointRadius: 5, tension: 0.2, fill: true }] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#ccc' } } }, scales: { y: { min: 3, max: 18, grid: { color: '#2a5545' }, ticks: { color: '#bbb' } }, x: { ticks: { color: '#bbb' } } } }
        });

        if (diceChart) diceChart.destroy();
        diceChart = new Chart(document.getElementById('diceChart'), {
            type: 'line',
            data: { labels, datasets: [
                { label: 'Tím', data: d1, borderColor: '#b77cff', borderWidth: 2, tension: 0.2 },
                { label: 'Vàng', data: d2, borderColor: '#fac05e', borderWidth: 2, tension: 0.2 },
                { label: 'Đỏ', data: d3, borderColor: '#ff7359', borderWidth: 2, tension: 0.2 }
            ] },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top', labels: { color: '#ccc', font: { size: 9 } } } }, scales: { y: { min: 1, max: 6, grid: { color: '#2a5545' }, ticks: { color: '#bbb' } }, x: { ticks: { color: '#bbb' } } } }
        });
    }

    function updateStats() {
        let total = predictionsLog.length;
        let wins = predictionsLog.filter(p => p.correct).length;
        document.getElementById('winCount').innerText = wins;
        document.getElementById('loseCount').innerText = total - wins;
        document.getElementById('winRate').innerText = total ? Math.round(wins/total*100) + '%' : '0%';
    }

    // Phân tích dây của bộ xí ngầu (3 bước gần nhất trong lịch sử)
    function analyzeDiceTrend(diceSequence) {
        if (diceSequence.length < 3) return "Chưa đủ dữ liệu";
        
        // Đếm số lần tăng/giảm/giữ của tổng (vì khó so bộ 3 số nên lấy tổng để dễ)
        let trendUp = 0, trendDown = 0;
        for (let i = 1; i < diceSequence.length; i++) {
            let sumPrev = diceSequence[i-1][0] + diceSequence[i-1][1] + diceSequence[i-1][2];
            let sumCurr = diceSequence[i][0] + diceSequence[i][1] + diceSequence[i][2];
            if (sumCurr > sumPrev) trendUp++;
            else if (sumCurr < sumPrev) trendDown++;
        }
        
        if (trendUp > trendDown + 1) return "DÂY ĐANG ĐI LÊN (DÀI)";
        if (trendDown > trendUp + 1) return "DÂY ĐANG ĐI XUỐNG (DÀI)";
        return "DÂY ĐI NGANG (NGẮN)";
    }

    async function analyze() {
        if (current20.length < 10) {
            document.getElementById('analysisDetail').innerHTML = '⚠️ Chưa đủ 20 phiên, bấm CẬP NHẬT.';
            return;
        }
        if (fullHistory.length === 0) await fetchData();
        
        document.getElementById('analysisDetail').innerHTML = '🔍 ĐANG PHÂN TÍCH...';
        
        // === 1. PHÂN TÍCH TỔNG ĐIỂM (giữ nguyên code cũ) ===
        let targetTotals = current20.map(s => getTotal(s));
        let targetD1 = current20.map(s => getDiceArray(s)[0]);
        let targetD2 = current20.map(s => getDiceArray(s)[1]);
        let targetD3 = current20.map(s => getDiceArray(s)[2]);
        let lastNumber = targetTotals[targetTotals.length-1];
        
        let matchedTotal = [];
        for (let i = 0; i <= fullHistory.length - 21; i++) {
            let histTotals = [];
            for (let j = 0; j < 20; j++) {
                let d = getDiceArray(fullHistory[i+j]);
                histTotals.push(d[0]+d[1]+d[2]);
            }
            if (histTotals[19] !== lastNumber) continue;
            let simTotal = calcSimilarity(targetTotals, histTotals);
            if (simTotal >= SIMILARITY) {
                let next = getDiceArray(fullHistory[i+20]);
                matchedTotal.push(next[0]+next[1]+next[2]);
            }
        }
        let taiTotal = matchedTotal.filter(t => t >= 11).length;
        let xiuTotal = matchedTotal.filter(t => t <= 10).length;
        let totalMatchesTotal = matchedTotal.length;
        let predTotal = (taiTotal > xiuTotal) ? 'TÀI' : (xiuTotal > taiTotal) ? 'XỈU' : '?';
        let confTotal = (taiTotal+xiuTotal) ? Math.round(Math.max(taiTotal,xiuTotal)/(taiTotal+xiuTotal)*100) : 0;
        
        // === 2. PHÂN TÍCH BỘ XÍ NGẦU CUỐI CÙNG ===
        let lastDice = getDiceArray(current20[current20.length-1]);
        let lastDiceKey = lastDice.join(',');
        
        let matchedDice = [];
        let diceHistory = []; // lưu chuỗi các bộ xí ngầu xuất hiện trước đó để phân tích dây
        for (let i = 0; i <= fullHistory.length - 2; i++) {
            let currentDice = getDiceArray(fullHistory[i]);
            let currentKey = currentDice.join(',');
            if (currentKey === lastDiceKey) {
                let nextDice = getDiceArray(fullHistory[i+1]);
                matchedDice.push(nextDice);
                // Lấy 3 bộ trước đó để phân tích dây
                if (i >= 3) {
                    diceHistory.push({
                        b3: getDiceArray(fullHistory[i-3]),
                        b2: getDiceArray(fullHistory[i-2]),
                        b1: getDiceArray(fullHistory[i-1]),
                        current: currentDice
                    });
                }
            }
        }
        
        let taiDice = 0, xiuDice = 0;
        for (let d of matchedDice) {
            let total = d[0]+d[1]+d[2];
            if (total >= 11) taiDice++;
            else if (total <= 10) xiuDice++;
        }
        let totalMatchesDice = matchedDice.length;
        let predDice = (taiDice > xiuDice) ? 'TÀI' : (xiuDice > taiDice) ? 'XỈU' : '?';
        let confDice = (taiDice+xiuDice) ? Math.round(Math.max(taiDice,xiuDice)/(taiDice+xiuDice)*100) : 0;
        
        // === 3. PHÂN TÍCH DÂY (từ diceHistory) ===
        let trend = "Không đủ dữ liệu";
        if (diceHistory.length >= 3) {
            let avgUp = 0, avgDown = 0;
            for (let h of diceHistory) {
                let sumB3 = h.b3[0]+h.b3[1]+h.b3[2];
                let sumB2 = h.b2[0]+h.b2[1]+h.b2[2];
                let sumB1 = h.b1[0]+h.b1[1]+h.b1[2];
                let sumCurr = h.current[0]+h.current[1]+h.current[2];
                if (sumCurr > sumB1) avgUp++; else if (sumCurr < sumB1) avgDown++;
            }
            if (avgUp > avgDown + 2) trend = "DÂY ĐANG ĐI LÊN (DÀI)";
            else if (avgDown > avgUp + 2) trend = "DÂY ĐANG ĐI XUỐNG (DÀI)";
            else trend = "DÂY ĐI NGANG (NGẮN)";
        }
        
        // === 4. TỔNG HỢP (ưu tiên bộ xí ngầu nếu có đủ mẫu, nếu không dùng tổng điểm) ===
        let final = '?', finalConf = 0;
        if (totalMatchesDice >= 3) {
            final = predDice;
            finalConf = confDice;
        } else if (totalMatchesTotal >= 3) {
            final = predTotal;
            finalConf = confTotal;
        } else {
            final = (lastNumber >= 11) ? 'TÀI' : 'XỈU';
            finalConf = 50;
        }
        
        // HIỂN THỊ
        document.getElementById('mainResult').innerText = final;
        document.getElementById('mainResult').className = `result-value ${final === 'TÀI' ? 'TAI' : 'XIU'}`;
        document.getElementById('mainConf').innerHTML = `🎲 ĐỘ TIN CẬY: ${finalConf}% | Tổng: ${totalMatchesTotal} cầu | Bộ xí ngầu: ${totalMatchesDice} cầu`;
        
        let detail = `
            📊 TỔNG ĐIỂM: tìm được ${totalMatchesTotal} cầu (độ tương đồng ≥ ${SIMILARITY}%)<br>
            &nbsp;&nbsp;→ Sau số ${lastNumber}: TÀI ${taiTotal}, XỈU ${xiuTotal} → dự đoán ${predTotal} (${confTotal}%)<br>
            🎲 BỘ XÍ NGẦU [${lastDiceKey}]: tìm được ${totalMatchesDice} lần xuất hiện<br>
            &nbsp;&nbsp;→ Sau đó: TÀI ${taiDice}, XỈU ${xiuDice} → dự đoán ${predDice} (${confDice}%)<br>
            📈 PHÂN TÍCH DÂY: ${trend}<br>
            🧠 KẾT LUẬN: <strong style="color:${final==='TÀI'?'#ff5e5e':'#5eff9e'}">${final}</strong> (${finalConf}%)
        `;
        if (totalMatchesTotal === 0 && totalMatchesDice === 0) {
            detail = `⚠️ KHÔNG TÌM THẤY CẦU NÀO. Dùng tạm số cuối ${lastNumber} → ${final} (${finalConf}%)`;
        }
        document.getElementById('analysisDetail').innerHTML = detail;
        
        // Lưu dự đoán để kiểm tra đúng/sai
        let currentPhien = current20[current20.length-1].phien;
        if (!predictionsLog.some(p => p.phien === currentPhien)) {
            predictionsLog.push({
                phien: currentPhien,
                predicted: final,
                actual: null,
                correct: false
            });
            if (predictionsLog.length > 100) predictionsLog.shift();
        }
    }
    
    async function refresh() {
        document.getElementById('analysisDetail').innerHTML = '⏳ ĐANG CẬP NHẬT...';
        await fetchData();
        if (fullHistory.length >= 20) {
            current20 = fullHistory.slice(-20);
            drawCharts();
            
            if (fullHistory.length >= 21) {
                let actualSession = fullHistory[fullHistory.length - 21];
                let actualTotal = getTotal(actualSession);
                let actualTx = getTaiXiu(actualTotal);
                let actualPhien = actualSession.phien;
                
                let found = predictionsLog.find(p => p.phien === actualPhien);
                if (found && found.actual === null && actualTx !== '?') {
                    found.actual = actualTx;
                    found.correct = (found.predicted === actualTx);
                    updateStats();
                    document.getElementById('analysisDetail').innerHTML = `✅ ĐÃ CẬP NHẬT: Dự đoán ${found.predicted} → Kết quả thực ${actualTx} (${found.correct ? 'ĐÚNG' : 'SAI'})`;
                } else {
                    document.getElementById('analysisDetail').innerHTML = `✅ ĐÃ CẬP NHẬT ${fullHistory.length} phiên. Bấm "PHÂN TÍCH CẦU".`;
                }
            } else {
                document.getElementById('analysisDetail').innerHTML = `✅ ĐÃ CẬP NHẬT ${fullHistory.length} phiên.`;
            }
            document.getElementById('statusText').innerHTML = `🟢 VPS | ${fullHistory.length} phiên`;
        } else {
            document.getElementById('analysisDetail').innerHTML = '⚠️ CHƯA ĐỦ 20 PHIÊN.';
        }
    }
    
    async function autoUpdate() {
        let oldLen = fullHistory.length;
        await fetchData();
        if (fullHistory.length > oldLen) {
            current20 = fullHistory.slice(-20);
            drawCharts();
            if (fullHistory.length >= 21) {
                let actualSession = fullHistory[fullHistory.length - 21];
                let actualTotal = getTotal(actualSession);
                let actualTx = getTaiXiu(actualTotal);
                let actualPhien = actualSession.phien;
                let found = predictionsLog.find(p => p.phien === actualPhien);
                if (found && found.actual === null && actualTx !== '?') {
                    found.actual = actualTx;
                    found.correct = (found.predicted === actualTx);
                    updateStats();
                }
            }
            document.getElementById('statusText').innerHTML = `🟢 VPS | ${fullHistory.length} phiên | Tự cập nhật`;
        }
    }
    
    document.getElementById('analyzeBtn').onclick = analyze;
    document.getElementById('refreshBtn').onclick = refresh;
    
    (async () => {
        await refresh();
        setInterval(autoUpdate, 15000);
    })();
</script>
</body>
</html>
