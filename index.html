<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BAPE AI · TÀI XỈU HEX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #000a0f;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Nunito', system-ui, sans-serif;
        }

        #gameFrame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* Tool chính */
        .ai-tool {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 360px;
            z-index: 99999;
            background: rgba(0, 20, 15, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(0, 255, 180, 0.5);
            box-shadow: 0 0 35px rgba(0, 255, 180, 0.2);
            cursor: grab;
            transition: 0.2s;
        }
        .ai-tool:active { cursor: grabbing; }

        .tool-header {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 255, 180, 0.3);
            cursor: grab;
        }
        .tool-header h2 {
            color: #00ffb3;
            font-size: 1rem;
            font-weight: 900;
        }
        .ctrl-btn {
            background: rgba(0, 255, 180, 0.2);
            border: none;
            color: #00ffb3;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        .tool-content {
            padding: 16px;
        }

        .pred-box {
            text-align: center;
            background: linear-gradient(135deg, #001f1a, #000d0a);
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 255, 180, 0.3);
        }
        .pred-label {
            font-size: 0.65rem;
            color: #88ffcc;
        }
        .pred-value {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 4px 0;
        }
        .pred-value.TAI { color: #ff4d4d; text-shadow: 0 0 15px #ff4d4d; }
        .pred-value.XIU { color: #33ff88; text-shadow: 0 0 15px #33ff88; }
        .confidence-bar {
            width: 100%;
            height: 5px;
            background: #1a2a25;
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0;
        }
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #33ff88, #00ffb3);
            width: 0%;
            transition: width 0.3s;
        }

        .stats-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .stat-card {
            flex: 1;
            background: rgba(0, 30, 25, 0.6);
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }
        .stat-card .num {
            font-size: 1.3rem;
            font-weight: 900;
            color: #00ffb3;
        }
        .stat-card .label {
            font-size: 0.55rem;
            color: #88ffcc;
        }

        .chain {
            margin-bottom: 16px;
        }
        .chain-title {
            font-size: 0.7rem;
            color: #88ffcc;
            margin-bottom: 6px;
        }
        .chain-list {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .chain-dot {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 0.8rem;
            background: #0a2a22;
        }
        .chain-dot.TAI {
            background: #ff4d4d;
            box-shadow: 0 0 6px #ff4d4d;
        }
        .chain-dot.XIU {
            background: #33ff88;
            box-shadow: 0 0 6px #33ff88;
            color: #000;
        }

        .dice-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 10px;
            border-radius: 14px;
        }
        .dice-name {
            width: 70px;
            font-size: 0.7rem;
            color: #88ffcc;
        }
        .dice-bar {
            flex: 1;
            height: 5px;
            background: #1a2a25;
            border-radius: 10px;
            display: flex;
            overflow: hidden;
        }
        .dice-high { background: #ff4d4d; }
        .dice-low { background: #33ff88; }
        .dice-val {
            width: 28px;
            text-align: center;
            font-weight: 900;
            font-size: 0.9rem;
        }

        table {
            width: 100%;
            font-size: 0.65rem;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th {
            background: rgba(0, 255, 180, 0.1);
            padding: 6px;
            color: #00ffb3;
        }
        td {
            padding: 4px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 180, 0.1);
        }
        .win { color: #33ff88; }
        .lose { color: #ff4d4d; }

        .api-status {
            font-size: 0.6rem;
            text-align: center;
            margin-top: 12px;
            color: #00ffb3;
        }

        /* Thu nhỏ */
        .ai-tool.mini {
            width: auto;
            border-radius: 50px;
            padding: 6px 16px;
            cursor: pointer;
        }
        .ai-tool.mini .tool-content { display: none; }
        .ai-tool.mini .tool-header { display: none; }
        .mini-bar {
            display: none;
            align-items: center;
            gap: 12px;
        }
        .ai-tool.mini .mini-bar { display: flex; }
        .mini-pred { font-size: 1.3rem; font-weight: 900; }
        .mini-conf { font-size: 0.7rem; color: #00ffb3; }
    </style>
</head>
<body>

<iframe id="gameFrame" src="https://web.sunwin.mw"></iframe>

<div class="ai-tool" id="aiTool">
    <div class="tool-header" id="dragHandle">
        <h2>🔮 BAPE · TÀI XỈU AI</h2>
        <button class="ctrl-btn" id="miniToggle">─</button>
    </div>
    <div class="tool-content" id="toolContent">
        <div class="pred-box">
            <div class="pred-label">📡 DỰ ĐOÁN PHIÊN TIẾP</div>
            <div class="pred-value" id="mainPred">--</div>
            <div class="confidence-bar"><div class="confidence-fill" id="confFill"></div></div>
            <div id="confText" style="font-size:0.65rem">Đợi dữ liệu...</div>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="num" id="winCount">0</div><div class="label">THẮNG</div></div>
            <div class="stat-card"><div class="num" id="loseCount">0</div><div class="label">THUA</div></div>
            <div class="stat-card"><div class="num" id="wrCount">0%</div><div class="label">WINRATE</div></div>
        </div>

        <div class="chain">
            <div class="chain-title">🎲 20 PHIÊN GẦN NHẤT</div>
            <div class="chain-list" id="historyChain"></div>
        </div>

        <div class="chain">
            <div class="chain-title">🎯 PHÂN TÍCH XÍ NGẦU (CAO/THẤP)</div>
            <div id="diceAnalysis"></div>
        </div>

        <div class="chain">
            <div class="chain-title">📋 LỊCH SỬ DỰ ĐOÁN</div>
            <div style="max-height: 180px; overflow-y: auto;">
                <table>
                    <thead><tr><th>Phiên</th><th>Dự</th><th>KQ</th><th></th></tr></thead>
                    <tbody id="historyTable"><tr><td colspan="4">Đang tải...</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="api-status" id="apiStatus">🟢 Kết nối API VPS...</div>
    </div>
    <div class="mini-bar">
        <span class="mini-pred" id="miniPred">--</span>
        <span class="mini-conf" id="miniConf">0%</span>
        <button class="ctrl-btn" id="restoreBtn" style="background:transparent;">🔓</button>
    </div>
</div>

<script>
    // ========== CẤU HÌNH ==========
    const API_URL = 'https://isa-accomplish-fork-capitol.trycloudflare.com/api/history';
    const INTERVAL = 3000;

    // ========== DATA ==========
    let sessions = [];          // [{phien, dice, result}]
    let predictions = [];       // [{phien, pred, actual, ok}]
    let lastPred = null;
    let lastPhien = null;

    // Load cache
    try {
        let saved = localStorage.getItem('bape_tx_v2');
        if(saved) {
            let d = JSON.parse(saved);
            if(d.predictions) predictions = d.predictions;
            if(d.sessions) sessions = d.sessions;
            if(d.lastPred) lastPred = d.lastPred;
            if(d.lastPhien) lastPhien = d.lastPhien;
        }
    } catch(e) {}

    function saveCache() {
        localStorage.setItem('bape_tx_v2', JSON.stringify({
            predictions, sessions, lastPred, lastPhien
        }));
    }

    // ========== HEX ENGINE (15 THUẬT TOÁN) ==========
    function createHex(dice) {
        let raw = dice.map(d => d.toString(16)).join('');
        raw += dice.reduce((a,b)=>a+b,0).toString(16);
        while(raw.length < 32) raw += raw;
        return raw.substring(0,32);
    }

    const algos = [
        h => parseInt(h.slice(0,2),16)%2===0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(2,4),16)%3===0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(4,6),16)>128 ? 'TAI' : 'XIU',
        h => h.charCodeAt(0)%2===0 ? 'TAI' : 'XIU',
        h => h.charCodeAt(15)%2===0 ? 'TAI' : 'XIU',
        h => h.charCodeAt(31)%2===0 ? 'TAI' : 'XIU',
        h => { let s=0; for(let i=0;i<32;i++) s+=parseInt(h[i],16); return s%2===0?'TAI':'XIU'; },
        h => { let x=0; for(let i=0;i<16;i++) x^=parseInt(h[i],16); return x%2===0?'TAI':'XIU'; },
        h => { let odd=0; for(let i=0;i<32;i++) if(parseInt(h[i],16)%2===1) odd++; return odd>16?'TAI':'XIU'; },
        h => parseInt(h.slice(10,12),16)%5!==0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(20,22),16)%3!==0 ? 'TAI' : 'XIU',
        h => parseInt(h.slice(30,32),16)%4!==0 ? 'TAI' : 'XIU',
        h => { let s=0; for(let i=0;i<32;i+=2) s+=parseInt(h.slice(i,i+2),16); return s%2===0?'TAI':'XIU'; },
        h => parseInt(h.slice(0,4),16)>32768 ? 'TAI' : 'XIU',
        h => h.charCodeAt(0)%3!==0 ? 'TAI' : 'XIU'
    ];

    function analyzeHex(hex) {
        let tai=0, xiu=0;
        for(let a of algos) a(hex)==='TAI' ? tai++ : xiu++;
        let total = tai+xiu;
        let pred = tai > xiu ? 'TAI' : 'XIU';
        let conf = Math.min(85, Math.max(55, Math.round(Math.max(tai,xiu)/total*100)));
        return { pred, conf };
    }

    // ========== UI RENDER ==========
    function renderChain() {
        let recent = sessions.slice(-20);
        if(!recent.length) return '<div>Chờ dữ liệu...</div>';
        return recent.map(s => {
            let res = s.result || s.r;
            return `<div class="chain-dot ${res}">${res==='TAI'?'T':'X'}</div>`;
        }).join('');
    }

    function renderDice() {
        if(!sessions.length) return '<div>Đang lấy từ VPS...</div>';
        let html = '';
        for(let i=0;i<3;i++) {
            let vals = sessions.map(s => (s.dice||s.dc)[i]);
            let last = vals[vals.length-1];
            let high = vals.filter(v=>v>=4).length;
            let low = vals.length - high;
            let pctHigh = (high/vals.length)*100;
            let pctLow = (low/vals.length)*100;
            let trend = high>low*1.3 ? '🔥 CAO' : (low>high*1.3 ? '❄️ THẤP' : (last>=4?'↗️ CAO':'↙️ THẤP'));
            html += `
                <div class="dice-row">
                    <span class="dice-name">Xí ngầu ${i+1}</span>
                    <div class="dice-bar">
                        <div class="dice-high" style="width:${pctHigh}%"></div>
                        <div class="dice-low" style="width:${pctLow}%"></div>
                    </div>
                    <span class="dice-val" style="color:${last>=4?'#ff4d4d':'#33ff88'}">${last}</span>
                    <span style="font-size:0.6rem">${trend}</span>
                </div>
            `;
        }
        return html;
    }

    function renderHistoryTable() {
        let tbody = document.getElementById('historyTable');
        if(!predictions.length) {
            tbody.innerHTML = '<tr><td colspan="4">Chưa có dự đoán</td></tr>';
            return;
        }
        let last15 = [...predictions].reverse().slice(0,15);
        tbody.innerHTML = last15.map(p => `
            <tr>
                <td>#${p.phien}</td>
                <td style="color:${p.pred==='TAI'?'#ff4d4d':'#33ff88'};font-weight:bold">${p.pred}</td>
                <td style="color:${p.actual==='TAI'?'#ff4d4d':'#33ff88'}">${p.actual}</td>
                <td class="${p.ok?'win':'lose'}">${p.ok?'✅':'❌'}</td>
            </tr>
        `).join('');
    }

    function updateStats() {
        let wins = predictions.filter(p=>p.ok).length;
        let total = predictions.length;
        let wr = total ? Math.round(wins/total*100) : 0;
        document.getElementById('winCount').innerText = wins;
        document.getElementById('loseCount').innerText = total - wins;
        document.getElementById('wrCount').innerText = wr+'%';
    }

    // ========== FETCH TỪ VPS ==========
    async function fetchSessions() {
        try {
            let res = await fetch(API_URL);
            let data = await res.json();
            let all = data.sessions || [];
            all.sort((a,b)=>parseInt(a.phien)-parseInt(b.phien));
            sessions = all.slice(-40);
            saveCache();
            document.getElementById('apiStatus').innerHTML = '🟢 VPS ONLINE | ' + sessions.length + ' phiên';
            document.getElementById('apiStatus').style.color = '#33ff88';
            return true;
        } catch(e) {
            document.getElementById('apiStatus').innerHTML = '🔴 Lỗi kết nối VPS, dùng cache';
            document.getElementById('apiStatus').style.color = '#ff4d4d';
            return false;
        }
    }

    // ========== MAIN LOOP ==========
    async function run() {
        await fetchSessions();
        
        if(sessions.length >= 2) {
            let latest = sessions[sessions.length-1];
            let prev = sessions[sessions.length-2];
            let dice = latest.dice || latest.dc;
            let hex = createHex(dice);
            let {pred, conf} = analyzeHex(hex);
            
            // Cập nhật UI
            let predEl = document.getElementById('mainPred');
            predEl.innerText = pred;
            predEl.className = 'pred-value ' + pred;
            document.getElementById('confFill').style.width = conf+'%';
            document.getElementById('confText').innerHTML = `🎯 Độ tin cậy: ${conf}% (15 thuật toán)`;
            document.getElementById('miniPred').innerHTML = pred==='TAI'?'🔴 TÀI':'🟢 XỈU';
            document.getElementById('miniConf').innerHTML = conf+'%';
            
            // Kiểm tra kết quả phiên trước
            if(prev && lastPhien !== prev.phien && (prev.result||prev.r)) {
                let real = prev.result || prev.r;
                if(lastPred && real) {
                    let isWin = (lastPred === real);
                    predictions.push({
                        phien: prev.phien,
                        pred: lastPred,
                        actual: real,
                        ok: isWin
                    });
                    if(predictions.length > 100) predictions.shift();
                    saveCache();
                    updateStats();
                    renderHistoryTable();
                    
                    // Flash effect
                    let box = document.querySelector('.pred-box');
                    box.style.transform = 'scale(1.02)';
                    setTimeout(()=>box.style.transform='scale(1)', 200);
                }
            }
            
            // Lưu dự đoán cho phiên hiện tại
            if(lastPhien !== latest.phien) {
                lastPred = pred;
                lastPhien = latest.phien;
                saveCache();
            }
            
            // Render UI
            document.getElementById('historyChain').innerHTML = renderChain();
            document.getElementById('diceAnalysis').innerHTML = renderDice();
        }
        
        setTimeout(run, INTERVAL);
    }

    // ========== DRAG & MINIMIZE ==========
    const tool = document.getElementById('aiTool');
    const dragHandle = document.getElementById('dragHandle');
    const miniToggle = document.getElementById('miniToggle');
    const restoreBtn = document.getElementById('restoreBtn');
    
    let isMini = false;
    function setMini(state) {
        isMini = state;
        if(isMini) tool.classList.add('mini');
        else tool.classList.remove('mini');
        localStorage.setItem('tool_mini', isMini);
    }
    miniToggle.onclick = () => setMini(true);
    restoreBtn.onclick = () => setMini(false);
    
    let savedMini = localStorage.getItem('tool_mini') === 'true';
    if(savedMini) setMini(true);
    
    // Drag
    let dragging = false, startX, startY, startLeft, startTop;
    dragHandle.onmousedown = (e) => {
        if(e.target.closest('.ctrl-btn')) return;
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        let rect = tool.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        tool.style.right = 'auto';
        tool.style.bottom = 'auto';
        tool.style.left = startLeft + 'px';
        tool.style.top = startTop + 'px';
        tool.style.cursor = 'grabbing';
        e.preventDefault();
    };
    window.onmousemove = (e) => {
        if(!dragging) return;
        let left = startLeft + (e.clientX - startX);
        let top = startTop + (e.clientY - startY);
        left = Math.min(window.innerWidth - tool.offsetWidth, Math.max(0, left));
        top = Math.min(window.innerHeight - tool.offsetHeight, Math.max(0, top));
        tool.style.left = left + 'px';
        tool.style.top = top + 'px';
    };
    window.onmouseup = () => {
        if(dragging) {
            dragging = false;
            tool.style.cursor = '';
            localStorage.setItem('tool_left', tool.style.left);
            localStorage.setItem('tool_top', tool.style.top);
        }
    };
    
    let savedLeft = localStorage.getItem('tool_left');
    let savedTop = localStorage.getItem('tool_top');
    if(savedLeft && savedTop) {
        tool.style.right = 'auto';
        tool.style.bottom = 'auto';
        tool.style.left = savedLeft;
        tool.style.top = savedTop;
    }
    
    // Start
    run();
</script>
</body>
</html>
