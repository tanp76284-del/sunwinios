<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<meta http-equiv="Content-Security-Policy"
content="upgrade-insecure-requests">

<title>👑 PHUC SIX</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
height:100vh;
overflow:hidden;
font-family:'Segoe UI',Arial,sans-serif;
}

/* GAME */

#gf{
position:fixed;
inset:0;
width:100%;
height:100%;
border:none;
z-index:1;
}

/* BOT WRAP */

.bw{
position:fixed;
right:10px;
top:120px;
z-index:999999;

display:flex;
flex-direction:column;
align-items:center;
}

/* BOX DỰ ĐOÁN */

.bot-tip{

background:rgba(8,8,20,.92);

border:1px solid #00fff2;

border-radius:14px;

padding:7px 12px;

margin-bottom:8px;

text-align:center;

backdrop-filter:blur(8px);

box-shadow:
0 0 18px rgba(0,255,255,.25),
inset 0 0 10px rgba(255,255,255,.05);

}

.pp{
font-size:1.15em;
font-weight:900;
}

.pp.TAI{
color:#ff4d4d;
}

.pp.XIU{
color:#39ff88;
}

.bi{
margin-top:2px;
font-size:.72em;
color:#bdbdbd;
}

/* BOT */

.bot-wrap{

position:relative;

width:78px;
height:78px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

animation:floatBot 2.3s ease-in-out infinite;

}

/* GLOW */

.bot-wrap::before{

content:'';

position:absolute;

inset:-10px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(0,255,255,.35),
transparent 70%
);

filter:blur(10px);

animation:glowPulse 2s infinite;

}

/* BOT GIF */

.bot-img{

width:75px;
height:75px;

object-fit:contain;

position:relative;

z-index:2;

pointer-events:none;

user-select:none;
-webkit-user-drag:none;

filter:
drop-shadow(0 0 10px rgba(0,255,255,.55))
drop-shadow(0 0 22px rgba(255,255,255,.2));

}

/* FLOAT */

@keyframes floatBot{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-8px);
}

100%{
transform:translateY(0px);
}

}

/* GLOW */

@keyframes glowPulse{

0%{
opacity:.55;
transform:scale(1);
}

50%{
opacity:1;
transform:scale(1.12);
}

100%{
opacity:.55;
transform:scale(1);
}

}

/* MENU */

.bm{

background:#111522;

border:2px solid #00fff2;

border-radius:15px;

padding:12px;

width:300px;

display:none;

text-align:center;

margin-top:8px;

box-shadow:
0 0 25px rgba(0,255,255,.25);

}

.bm.show{
display:block;
}

.bm h3{

color:#00fff2;

font-size:.9em;

margin-bottom:8px;

}

/* KEY */

.key-box{
padding:5px;
}

.key-box input{

width:100%;

padding:11px;

border:none;

outline:none;

background:#070b14;

color:#fff;

border:2px solid rgba(0,255,255,.18);

border-radius:10px;

text-align:center;

font-size:.9em;

margin-bottom:8px;

}

.key-box button{

width:100%;

padding:11px;

border:none;

border-radius:10px;

background:#27e7df;

color:#000;

font-weight:900;

cursor:pointer;

font-size:.92em;

}

.msg{
margin-top:6px;
font-size:.78em;
}

.msg.e{
color:#ff4d4d;
}

/* STATS */

.st{

display:flex;

justify-content:space-around;

font-size:.75em;

margin-bottom:8px;

color:#999;

}

.st b{
color:#00fff2;
}

/* TABLE */

.scroll-box{

max-height:250px;

overflow-y:auto;

}

table{

width:100%;

border-collapse:collapse;

font-size:.85em;

}

th{

padding:6px 3px;

background:rgba(255,255,255,.05);

color:#999;

}

td{

padding:6px 3px;

border-bottom:1px solid rgba(255,255,255,.05);

text-align:center;

}

.T{
color:#ff4d4d;
font-weight:bold;
}

.X{
color:#39ff88;
font-weight:bold;
}

.ok{
color:#39ff88;
font-weight:bold;
}

.no{
color:#ff4d4d;
font-weight:bold;
}

</style>
</head>

<body>

<!-- GAME -->

<iframe
id="gf"
src="https://web.sunwin.mw">
</iframe>

<!-- BOT -->

<div class="bw" id="bw">

<!-- BOX -->

<div class="bot-tip" id="bpDiv">

<div class="pp" id="pp">
--
</div>

<div class="bi" id="bi">
Đang tải...
</div>

</div>

<!-- BOT TRẮNG -->

<div class="bot-wrap"
onclick="toggleMenu()">

<img
src="https://iili.io/F5s8YEx.gif"
class="bot-img">

</div>

<!-- MENU -->

<div class="bm" id="bm">

<h3>👑 PHUC SIX</h3>

<!-- KEY -->

<div class="key-box" id="keyBox">

<p style="
color:#888;
font-size:.8em;
margin-bottom:6px;
">
Nhập key để mở khóa
</p>

<input
type="text"
id="keyInput"
placeholder="Nhập key..."
maxlength="20">

<button onclick="verifyKey()">
🔓 MỞ KHÓA
</button>

<p class="msg" id="keyMsg"></p>

</div>

<!-- MAIN -->

<div id="mainMenu"
style="display:none">

<div class="st">

<span>
Tổng:
<b id="mt">0</b>
</span>

<span>
✅:
<b id="md"
style="color:#39ff88">
0
</b>
</span>

<span>
❌:
<b id="ms"
style="color:#ff4d4d">
0
</b>
</span>

<span>
🎯:
<b id="ma">--%</b>
</span>

</div>

<div class="scroll-box">

<table>

<thead>

<tr>

<th>#</th>
<th>Dự đoán</th>
<th>KQ</th>
<th>TT</th>

</tr>

</thead>

<tbody id="mtb">

<tr>

<td colspan="4">
Chưa có
</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

/* KEY */

const KS =
'https://safely-christmas-das-classes.trycloudflare.com';

const AK =
'phuctoolnetad';

/* DEVICE */

let did =
localStorage.getItem('pd') || '';

if(!did){

did =
'd' +
Math.random()
.toString(36)
.substr(2,9);

localStorage.setItem('pd',did);

}

/* MENU */

function toggleMenu(){

var bm =
document.getElementById('bm');

bm.classList.toggle('show');

if(
bm.classList.contains('show')
){

checkKey();

if(
document.getElementById('mainMenu')
.style.display !== 'none'
){
rm();
}

}

}

/* KEY CHECK */

async function checkKey(){

var sk =
localStorage.getItem('pk');

if(sk === AK){

showMain();

return;

}

if(sk){

try{

var r = await fetch(

KS +
'/api/check?key=' +
encodeURIComponent(sk) +
'&device=' +
encodeURIComponent(did)

);

var d = await r.json();

if(d.valid){

showMain();

return;

}

}catch(e){}

}

showKeyInput();

}

/* SHOW INPUT */

function showKeyInput(){

document.getElementById('keyBox')
.style.display='block';

document.getElementById('mainMenu')
.style.display='none';

}

/* SHOW MAIN */

function showMain(){

document.getElementById('keyBox')
.style.display='none';

document.getElementById('mainMenu')
.style.display='block';

}

/* VERIFY */

async function verifyKey(){

var k =
document.getElementById('keyInput')
.value.trim();

var m =
document.getElementById('keyMsg');

m.className='msg';

m.textContent='';

if(!k || k.length < 7){

m.className='msg e';

m.textContent=
'❌ Key phải đủ 7 ký tự!';

return;

}

if(k === AK){

localStorage.setItem('pk',k);

showMain();

return;

}

try{

var r = await fetch(

KS +
'/api/check?key=' +
encodeURIComponent(k) +
'&device=' +
encodeURIComponent(did)

);

var d = await r.json();

if(d.valid){

localStorage.setItem('pk',k);

showMain();

}else{

m.className='msg e';

m.textContent =
'❌ ' +
(d.msg || 'Key không hợp lệ!');

}

}catch(e){

m.className='msg e';

m.textContent=
'❌ Không kết nối server!';

}

}

/* DRAG BOT */

var bw =
document.getElementById('bw');

var dg=false,
sx,sy,sl,st;

bw.addEventListener(
'mousedown',
function(e){

if(e.target.closest('.bm'))
return;

dg=true;

sx=e.clientX;
sy=e.clientY;

sl=bw.offsetLeft;
st=bw.offsetTop;

}
);

document.addEventListener(
'mousemove',
function(e){

if(!dg) return;

bw.style.left =
(sl + e.clientX - sx)
+ 'px';

bw.style.top =
(st + e.clientY - sy)
+ 'px';

}
);

document.addEventListener(
'mouseup',
function(){

dg=false;

}
);

</script>

</body>
</html>
