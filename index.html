<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHUC SIX V15</title>

<style>
body{margin:0;background:#000;font-family:Arial;color:#fff;overflow:hidden}
#gf{position:fixed;width:100%;height:100%;border:none}

.bw{position:fixed;right:10px;top:120px;z-index:9999;display:flex;flex-direction:column;align-items:center}

.bot-wrap{width:90px;height:90px;display:flex;align-items:center;justify-content:center}
.bot-wrap img{width:90px;height:90px}

.bot-tip{background:#111;padding:6px 10px;border:1px solid #0ff;border-radius:10px;text-align:center;margin-bottom:5px}
.pp{font-weight:bold}
.TAI{color:#ff4d4d}
.XIU{color:#33ff88}

.bm{display:none;background:#111;border:1px solid #0ff;padding:10px;border-radius:10px;width:300px}
.bm.show{display:block}

.st{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:#aaa}

table{width:100%;font-size:12px;border-collapse:collapse}
td,th{padding:3px;border-bottom:1px solid #222;text-align:center}
.ok{color:#33ff88}
.no{color:#ff4d4d}
</style>
</head>

<body>

<iframe id="gf" src="https://web.sunwin.mw"></iframe>

<div class="bw" id="bw">

<div class="bot-tip">
<div id="pp" class="pp">--</div>
<div id="bi" style="font-size:11px;color:#aaa">READY</div>
</div>

<div class="bot-wrap" id="botBtn">
<img src="https://i.postimg.cc/4dRg6Mrt/IMG-3575.gif">
</div>

<div class="bm" id="bm">

<h3>AI ANALYSIS</h3>

<div class="st">
<span id="t1">T:0</span>
<span id="t2">X:0</span>
<span id="t3">WR:0%</span>
</div>

<table>
<thead>
<tr><th>#</th><th>Dự</th><th>KQ</th><th></th></tr>
</thead>
<tbody id="tb"></tbody>
</table>

</div>
</div>

<script>

document.getElementById('botBtn').onclick=()=>{
document.getElementById('bm').classList.toggle('show');
}

// DATA
let D={
s:[],
pr:[],
lp:'',
lastPhien:''
};

let KEY="psv44";

// LOAD CACHE
try{
let c=localStorage.getItem(KEY);
if(c){
let p=JSON.parse(c);
D.s=p.s||[];
D.pr=p.pr||[];
}
}catch(e){}

function save(){
localStorage.setItem(KEY,JSON.stringify(D));
}

// LOAD SERVER
async function load(){
try{
let r=await fetch('https://isa-accomplish-fork-capitol.trycloudflare.com/api/history');
let d=await r.json();
let ns=d.sessions||[];

let map={};

D.s.forEach(x=>map[x.phien]=x);
ns.forEach(x=>map[x.phien]=x);

D.s=Object.values(map).sort((a,b)=>a.phien-b.phien);

save();
return true;
}catch(e){
return false;
}
}

// =====================
// PREDICT (THỐNG KÊ THẬT)
// =====================
function predict(s){

let n=s.length;
if(n<30)return{pr:null,cf:50,skip:true};

let r=s.map(x=>x.result||x.r);

let score={TAI:0,XIU:0};

// 20 phiên gần
let last20=r.slice(-20);
let t20=last20.filter(x=>x==='TAI').length;
let x20=20-t20;

if(t20>=14)score.XIU+=10;
if(x20>=14)score.TAI+=10;

// pattern nhỏ
for(let k=3;k<=5;k++){

let pat=r.slice(n-k,n).join('');

let t=0,x=0;

for(let i=0;i<n-k;i++){

if(r.slice(i,i+k).join('')===pat){

r[i+k]==='TAI'?t++:x++;

}

}

if(t+x>5){
score.TAI+=t;
score.XIU+=x;
}

}

// streak
let last=r[n-1];
let streak=1;

for(let i=n-2;i>=0;i--){
if(r[i]===last)streak++;
else break;
}

if(streak>=5){
score[last==='TAI'?'XIU':'TAI']+=12;
}

// quyết định
let diff=Math.abs(score.TAI-score.XIU);
if(diff<5)return{pr:null,cf:50,skip:true};

let pr=score.TAI>score.XIU?'TAI':'XIU';

let cf=Math.round((Math.max(score.TAI,score.XIU)/(score.TAI+score.XIU))*100);

cf=Math.max(52,Math.min(70,cf));

return{pr,cf,skip:false};
}

// =====================
// LOOP
// =====================
async function loop(){

await load();

let s=D.s;
let n=s.length;

if(n>30){

let p=predict(s);

let cur=s[n-1];

if(D.lp && cur.phien!=D.lastPhien){

let real=cur.result;

D.pr.push({
p:cur.phien,
pr:D.lp,
ac:real,
ok:D.lp===real
});

}

if(p.pr){

D.lp=p.pr;
D.lastPhien=cur.phien;

let win=D.pr.filter(x=>x.ok).length;
let total=D.pr.length;

let wr=total?Math.round(win/total*100):0;

document.getElementById('pp').innerText=
p.pr==='TAI'?'🔴 TÀI':'🟢 XỈU';

document.getElementById('bi').innerText=
p.cf+'% | WR '+wr+'% | '+n+' phiên';

document.getElementById('t1').innerText='T:'+win;
document.getElementById('t2').innerText='X:'+(total-win);
document.getElementById('t3').innerText='WR:'+wr+'%';

render();
}
}

save();

setTimeout(loop,2500);
}

// =====================
// TABLE
// =====================
function render(){

let tb=document.getElementById('tb');

if(!D.pr.length){
tb.innerHTML='<tr><td colspan=4>---</td></tr>';
return;
}

tb.innerHTML=D.pr.slice(-50).reverse().map(x=>`
<tr>
<td>#${x.p}</td>
<td>${x.pr}</td>
<td>${x.ac}</td>
<td class="${x.ok?'ok':'no'}">${x.ok?'✔':'✖'}</td>
</tr>
`).join('');
}

// START
loop();

</script>

</body>
</html>
