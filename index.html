<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bot Test</title>

<style>

body{
    margin:0;
    height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* KHUNG BOT */
.bot-wrap{
    position:relative;
    width:90px;
    height:90px;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* HIỆU ỨNG GLOW */
.bot-wrap::before{
    content:'';
    position:absolute;
    inset:-12px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,255,255,.4), transparent 70%);
    filter:blur(10px);
    animation:glow 2s infinite ease-in-out;
}

/* BOT */
.bot-img{
    width:80px;
    height:80px;
    object-fit:contain;

    z-index:2;
    position:relative;

    user-select:none;
    -webkit-user-drag:none;

    filter:
    drop-shadow(0 0 10px rgba(0,255,255,.6))
    drop-shadow(0 0 20px rgba(255,255,255,.25));
}

/* FLOAT */
@keyframes glow{
    0%{transform:scale(1); opacity:.6;}
    50%{transform:scale(1.15); opacity:1;}
    100%{transform:scale(1); opacity:.6;}
}

</style>

</head>

<body>

<div class="bot-wrap">

    <img
    src="https://i.postimg.cc/4dRg6Mrt/IMG-3575.gif"
    class="bot-img">

</div>

</body>
</html>
