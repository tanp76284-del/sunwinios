<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='40' fill='%230a0a0f'/><text x='90' y='115' text-anchor='middle' font-size='90' font-weight='bold' fill='%23ffd700'>👑</text></svg>">
    <meta name="theme-color" content="#0a0a0f">
    <title>👑 PHUC SIX</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#000;height:100vh;overflow:hidden;font-family:'Segoe UI',Arial}
        #gf{width:100%;height:100%;border:none;position:fixed;top:0;left:0;z-index:1}
        
        .bw{position:fixed;z-index:9999;right:8px;top:60px;display:flex;flex-direction:column;align-items:center;gap:0;will-change:transform;transition:none}
        .bb{width:50px;height:50px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4em;box-shadow:0 3px 15px rgba(255,255,255,.3);cursor:pointer}
        .bb:active{transform:scale(1.05)}
        .bp{background:#1a1a2e;border:1px solid #ffd700;border-radius:10px;padding:5px 12px;text-align:center;margin-bottom:3px;font-size:.65em;color:#fff;white-space:nowrap}
        .bp .pp{font-size:1.2em;font-weight:900}.pp.TAI{color:#e74c3c}.pp.XIU{color:#2ecc71}
        .bp .bi{color:#aaa;font-size:.78em;margin-top:1px}
        
        .bm{background:#151520;border:2px solid #ffd700;border-radius:12px;padding:10px;width:300px;display:none;text-align:center;font-size:.65em;box-shadow:0 0 30px rgba(255,215,0,.25);z-index:1}
        .bm.show{display:block}
        .bm h3{color:#ffd700;font-size:.85em;margin-bottom:6px;position:sticky;top:0;background:#151520;padding:5px 0}
        .bm .st{display:flex;justify-content:space-around;margin-bottom:6px;color:#888;font-size:.7em;position:sticky;top:30px;background:#151520;padding:3px 0}
        .bm .st b{color:#ffd700}
        .scroll-box{max-height:250px;overflow-y:auto;-webkit-overflow-scrolling:touch}
        table{width:100%;border-collapse:collapse;font-size:.85em}
        th{background:rgba(255,255,255,.05);padding:4px 2px;color:#888;position:sticky;top:0}
        td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center}
        .T{color:#e74c3c;font-weight:bold}.X{color:#2ecc71;font-weight:bold}
        .ok{color:#2ecc71;font-weight:bold}.no{color:#e74c3c;font-weight:bold}
        
        .key-box{display:none;text-align:center;padding:10px}
        .key-box input{width:100%;padding:10px;border:2px solid rgba(255,215,0,.3);background:#0a0a0f;color:#fff;border-radius:8px;font-size:.9em;text-align:center;letter-spacing:2px;margin-bottom:8px}
        .key-box button{width:100%;padding:10px;background:#ffd700;color:#000;border:none;border-radius:8px;font-weight:900;cursor:pointer;font-size:.9em}
        .key-box .msg{font-size:.75em;margin-top:6px}.msg.e{color:#e74c3c}.msg.s{color:#2ecc71}
    </style>
</head>
<body>

<iframe id="gf" src="https://web.sunwin.mw"></iframe>

<div class="bw" id="bw">
    <div class="bp" id="bpDiv">
        <div class="pp" id="pp">--</div>
        <div class="bi" id="bi">Đang tải...</div>
    </div>
    <div class="bb" onclick="toggleMenu()">🤖</div>
    <div class="bm" id="bm">
        <h3>👑 PHUC SIX</h3>
        <div class="key-box" id="keyBox">
            <p style="color:#888;font-size:.8em">Nhập key để mở khóa</p>
            <input type="text" id="keyInput" placeholder="Nhập key..." maxlength="20">
            <button onclick="verifyKey()">🔓 MỞ KHÓA</button>
            <p class="msg" id="keyMsg"></p>
        </div>
        <div id="mainMenu" style="display:none">
            <div class="st">
                <span>Tổng: <b id="mt">0</b></span>
                <span>✅: <b id="md" style="color:#2ecc71">0</b></span>
                <span>❌: <b id="ms" style="color:#e74c3c">0</b></span>
                <span>🎯: <b id="ma">--%</b></span>
            </div>
            <div class="scroll-box">
                <table><thead><tr><th>Phiên</th><th>Dự đoán</th><th>KQ</th><th>TT</th></tr></thead>
                <tbody id="mtb"><tr><td colspan="4">Chưa có</td></tr></tbody></table>
            </div>
        </div>
    </div>
</div>

<script>
const KS='https://safely-christmas-das-classes.trycloudflare.com',AK='phuctoolnetad';
let did=localStorage.getItem('pd')||'';if(!did){did='d'+Math.random().toString(36).substr(2,9);localStorage.setItem('pd',did);}

// ==================== DRAG MƯỢT MÀ ====================
const bw=document.getElementById('bw');
let dg=!1,sx,sy,sl,st;
bw.addEventListener('pointerdown',e=>{if(e.target.closest('.bm'))return;dg=!0;sx=e.clientX;sy=e.clientY;sl=bw.offsetLeft;st=bw.offsetTop;bw.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!dg)return;let x=sl+e.clientX-sx,y=st+e.clientY-sy;bw.style.left=x+'px';bw.style.top=y+'px'});
document.addEventListener('pointerup',()=>dg=!1);

// ==================== KEY ====================
function toggleMenu(){const bm=document.getElementById('bm');bm.classList.toggle('show');if(bm.classList.contains('show')){checkKey();if(document.getElementById('mainMenu').style.display!=='none')rm();}}
async function checkKey(){const sk=localStorage.getItem('pk');if(sk===AK){showMain();return;}if(sk){try{const r=await fetch(`${KS}/api/check?key=${encodeURIComponent(sk)}&device=${encodeURIComponent(did)}`);const d=await r.json();if(d.valid){showMain();return;}}catch(e){}}showKeyInput();}
function showKeyInput(){document.getElementById('keyBox').style.display='block';document.getElementById('mainMenu').style.display='none';document.getElementById('bpDiv').style.display='none';}
function showMain(){document.getElementById('keyBox').style.display='none';document.getElementById('mainMenu').style.display='block';document.getElementById('bpDiv').style.display='block';}
async function verifyKey(){const k=document.getElementById('keyInput').value.trim(),m=document.getElementById('keyMsg');m.className='msg';m.textContent='';if(!k||k.length<7){m.className='msg e';m.textContent='❌ Key phải đủ 7 ký tự!';return;}if(k===AK){localStorage.setItem('pk',k);showMain();return;}try{const r=await fetch(`${KS}/api/check?key=${encodeURIComponent(k)}&device=${encodeURIComponent(did)}`);const d=await r.json();if(d.valid){localStorage.setItem('pk',k);showMain();}else{m.className='msg e';m.textContent='❌ '+(d.msg||'Key không hợp lệ!');}}catch(e){m.className='msg e';m.textContent='❌ Không kết nối server!';}}

// ==================== MAIN APP ====================
const A=['https://bracket-ellen-roads-prefer.trycloudflare.com/api/tx','https://sun-ls.onrender.com/sunlon','https://toolsunwin-gq58.onrender.com/api/ditmemaysun'];
let D={s:[],t:0,x:0,su:0,se:new Set(),pr:[],lp:''};
try{let r=localStorage.getItem('psv21');if(r){let p=JSON.parse(r);D.s=p.s||[];D.t=p.t||0;D.x=p.x||0;D.su=p.su||0;D.se=new Set(p.se||[]);D.pr=p.pr||[];D.lp=p.lp||'';}}catch(e){}
function sv(){try{localStorage.setItem('psv21',JSON.stringify({s:D.s.slice(-50000),t:D.t,x:D.x,su:D.su,se:[...D.se].slice(-50000),pr:D.pr.slice(-5000),lp:D.lp}));}catch(e){}}

function pd(s){
    let n=s.length;if(n<3)return{pr:null,cf:0,rs:'Cần '+(3-n)+' phiên'};
    let r=s.map(x=>x.r),t=s.map(x=>x.t);
    let lr=r[n-1],lt=t[n-1];
    let sc={TAI:0,XIU:0},rs=[];
    if(lt>=17){sc.TAI+=99;rs.push('Tổng≥17');}else if(lt<=4){sc.XIU+=98;rs.push('Tổng≤4');}else{
        let st=1;for(let i=n-2;i>=0;i--){if(r[i]===lr)st++;else break;}
        if(st>=7){sc[lr==='TAI'?'XIU':'TAI']+=35;rs.push('Bệt'+st+'→ĐẢO');}else if(st>=5){sc[lr]+=25;rs.push('Bệt'+st+'→THEO');}else if(st>=3){sc[lr]+=15;rs.push('Bệt'+st);}else{sc[lr==='TAI'?'XIU':'TAI']+=10;rs.push('Xen kẽ');}
        if(n>=4&&r[n-1]===r[n-3]&&r[n-2]===r[n-4]&&r[n-1]!==r[n-2]){sc[r[n-2]]+=25;rs.push('1-1');}
        if(n>=6&&r[n-1]===r[n-2]&&r[n-3]===r[n-5]&&r[n-1]!==r[n-3]){sc[r[n-3]]+=20;rs.push('2-1');}
        if(n>=6&&r[n-1]===r[n-2]&&r[n-3]===r[n-4]&&r[n-1]!==r[n-3]){sc[r[n-3]]+=20;rs.push('2-2');}
        for(let i=0;i<3;i++){let v=s.map(x=>x.dc[i]),vl=v.length,lv=v[vl-1];let vs=1;for(let j=vl-2;j>=0;j--){if(v[j]===lv)vs++;else break;}let bg=v.filter(x=>x>=4).length;let nv=lv;if(vs>=5)nv=lv===6?5:lv+1;else if(vs>=3)nv=lv;else nv=bg>vl/2?Math.round(4+Math.random()):Math.round(2+Math.random());nv=Math.max(1,Math.min(6,nv));if(nv>=4)sc.TAI+=5;else sc.XIU+=5;}
        if(lt>=14&&lt<=16){sc.TAI+=18;rs.push('Cao→TÀI');}else if(lt>=5&&lt<=7){sc.XIU+=18;rs.push('Thấp→XỈU');}
        let l6=r.slice(-6),t6=l6.filter(x=>x==='TAI').length;if(t6>=5){sc.XIU+=12;rs.push(t6+'/6T');}else if(t6<=1){sc.TAI+=12;rs.push((6-t6)+'/6X');}
        if(n>=8){let l3=r.slice(-3).join(''),mt=0,mx=0;for(let i=0;i<=n-4;i++){if(r.slice(i,i+3).join('')===l3){r[i+3]==='TAI'?mt++:mx++;}}if(mt+mx>=4){if(mt>mx){sc.TAI+=14;rs.push('Pattern→TÀI');}else{sc.XIU+=14;rs.push('Pattern→XỈU');}}}
    }
    let pr=sc.TAI>sc.XIU?'TAI':'XIU',tot=sc.TAI+sc.XIU;
    return{pr,cf:tot>0?Math.min(99,Math.max(55,Math.round(Math.max(sc.TAI,sc.XIU)/tot*100))):50,rs:rs.slice(0,3).join('|')};
}

async function up(){
    let res=[];
    for(let a of A){try{let r=await fetch(a,{signal:AbortSignal.timeout(5000)});let d=await r.json();
    if(d?.phien&&d.xuc_xac_1!==undefined)res.push({p:String(d.phien),dc:[d.xuc_xac_1,d.xuc_xac_2,d.xuc_xac_3],t:d.tong,r:(d.ket_qua==='Tài'||d.ket_qua==='TAI')?'TAI':'XIU'});
    if(d?.phien_hien_tai&&d.xuc_xac_1!==undefined)res.push({p:String(d.phien_hien_tai),dc:[d.xuc_xac_1,d.xuc_xac_2,d.xuc_xac_3],t:d.tong,r:(d.ket_qua==='Tài'||d.ket_qua==='TAI')?'TAI':'XIU'});
    if(d?.Phien&&d.Xuc_xac_1!==undefined)res.push({p:String(d.Phien),dc:[d.Xuc_xac_1,d.Xuc_xac_2,d.Xuc_xac_3],t:d.Tong,r:d.Ket_qua==='Tài'?'TAI':'XIU'});}catch(e){}}
    for(let i of res){if(!D.se.has(i.p)){D.se.add(i.p);if(D.lp&&D.s.length>0){let l=D.s[D.s.length-1];if(parseInt(i.p)===parseInt(l.p)+1){D.pr.push({p:i.p,pr:D.lp,ac:i.r,ok:D.lp===i.r});}}D.s.push(i);D.su+=i.t;i.r==='TAI'?D.t++:D.x++;}}
    D.s.sort((a,b)=>parseInt(a.p)-parseInt(b.p));
    if(D.s.length>=3){let p=pd(D.s);if(p.pr){D.lp=p.pr;document.getElementById('pp').textContent=p.pr==='TAI'?'🔴 TÀI':'🟢 XỈU';document.getElementById('pp').className='pp '+p.pr;document.getElementById('bi').textContent='#'+(parseInt(D.s[D.s.length-1].p)+1)+' | '+p.cf+'%';}}
    sv();if(document.getElementById('bm').classList.contains('show')&&document.getElementById('mainMenu').style.display!=='none')rm();
}

function rm(){
    let pr=D.pr,tp=pr.length,cp=pr.filter(p=>p.ok).length;
    document.getElementById('mt').textContent=tp;document.getElementById('md').textContent=cp;
    document.getElementById('ms').textContent=tp-cp;document.getElementById('ma').textContent=tp>0?Math.round(cp/tp*100)+'%':'--%';
    let tb=document.getElementById('mtb');
    if(pr.length===0)tb.innerHTML='<tr><td colspan="4">Chưa có</td></tr>';
    else tb.innerHTML=[...pr].reverse().slice(0,100).map(p=>`<tr><td>#${p.p}</td><td class="${p.pr==='TAI'?'T':'X'}">${p.pr}</td><td class="${p.ac==='TAI'?'T':'X'}">${p.ac}</td><td class="${p.ok?'ok':'no'}">${p.ok?'✅':'❌'}</td></tr>`).join('');
}

checkKey();up();setInterval(up,4000);
</script>
</body>
</html>
